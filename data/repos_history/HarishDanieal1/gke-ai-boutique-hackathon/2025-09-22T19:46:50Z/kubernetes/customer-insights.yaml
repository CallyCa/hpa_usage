apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-insights-agent
  namespace: ai-boutique
  labels:
    app: customer-insights-agent
    component: ai-agent
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: customer-insights-agent
  template:
    metadata:
      labels:
        app: customer-insights-agent
        component: ai-agent
        version: "1.0"
    spec:
      containers:
      - name: customer-insights
        image: gcr.io/YOUR_PROJECT_ID/customer-insights-agent:latest
        ports:
        - containerPort: 8003
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "8003"
        - name: AGENT_TYPE
          value: "customer-insights"
        - name: MCP_SERVER_URL
          value: "http://mcp-server-service:8080"
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1001
---
apiVersion: v1
kind: Service
metadata:
  name: customer-insights-service
  namespace: ai-boutique
  labels:
    app: customer-insights-agent
spec:
  type: ClusterIP
  ports:
  - port: 8003
    targetPort: 8003
    protocol: TCP
    name: http
  selector:
    app: customer-insights-agent
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: customer-insights-hpa
  namespace: ai-boutique
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: customer-insights-agent
  minReplicas: 1
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
