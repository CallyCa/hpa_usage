apiVersion: v1
kind: List
items:
  # ServiceMonitor for Consumer metrics
  - apiVersion: monitoring.coreos.com/v1
    kind: ServiceMonitor
    metadata:
      name: kafka-consumer-metrics
      labels:
        app: kafka-consumer
        app.kubernetes.io/component: consumer
        app.kubernetes.io/part-of: kafka-demo
    spec:
      selector:
        matchLabels:
          app: kafka-consumer
      endpoints:
        - port: http
          path: /actuator/prometheus
          interval: 30s

  # ScaledObject for Custom Metrics Autoscaler
  - apiVersion: keda.sh/v1alpha1
    kind: ScaledObject
    metadata:
      name: kafka-consumer-scaler
      labels:
        app: kafka-consumer
        app.kubernetes.io/component: consumer
        app.kubernetes.io/part-of: kafka-demo
    spec:
      scaleTargetRef:
        apiVersion: apps.openshift.io/v1
        kind: DeploymentConfig
        name: kafka-consumer
      minReplicaCount: 1
      maxReplicaCount: 5
      pollingInterval: 15
      cooldownPeriod: 60
      triggers:
        # Kafka Consumer Lag Trigger
        - type: kafka
          metadata:
            bootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS}
            consumerGroup: ${KAFKA_CONSUMER_GROUP:demo-consumer-group}
            topic: ${KAFKA_TOPIC:demo-messages}
            lagThreshold: '10'
            offsetResetPolicy: earliest
        # Prometheus Metrics Trigger (Alternative/Additional)
        - type: prometheus
          metadata:
            serverAddress: http://prometheus-operated.openshift-monitoring.svc.cluster.local:9090
            metricName: kafka_consumer_lag_sum
            threshold: '20'
            query: |
              sum(kafka_consumer_lag_sum{topic="${KAFKA_TOPIC:demo-messages}",group="${KAFKA_CONSUMER_GROUP:demo-consumer-group}"})

---
# HorizontalPodAutoscaler (Traditional HPA for comparison)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kafka-consumer-hpa
  labels:
    app: kafka-consumer
    app.kubernetes.io/component: consumer
    app.kubernetes.io/part-of: kafka-demo
spec:
  scaleTargetRef:
    apiVersion: apps.openshift.io/v1
    kind: DeploymentConfig
    name: kafka-consumer
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30

---
# VerticalPodAutoscaler (VPA Configuration)
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: kafka-consumer-vpa
  labels:
    app: kafka-consumer
    app.kubernetes.io/component: consumer
    app.kubernetes.io/part-of: kafka-demo
spec:
  targetRef:
    apiVersion: apps.openshift.io/v1
    kind: DeploymentConfig
    name: kafka-consumer
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: kafka-consumer
        maxAllowed:
          cpu: 500m
          memory: 1Gi
        minAllowed:
          cpu: 50m
          memory: 128Mi
        controlledResources: ["cpu", "memory"]