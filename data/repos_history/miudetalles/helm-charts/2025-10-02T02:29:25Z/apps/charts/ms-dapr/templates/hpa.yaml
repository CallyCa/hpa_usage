{{ if .Values.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "inkcloud.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "inkcloud.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "inkcloud.name" . }}
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
    {{- if .Values.hpa.enabledNetworking }}
    - type: Pods
      pods:
        metric:
          name: container_sockets
        target:
          type: AverageValue
          averageValue: {{ .Values.hpa.networkingThreshold }}
    {{- end }}
    {{- range .Values.hpa.containerResources }}
    - type: ContainerResource
      containerResource:
        name: {{ .name }}
        container: {{ .container }}
        target:
          type: Utilization
          averageUtilization: {{ .targetAverageUtilization }}
    {{- end }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: {{ .Values.hpa.scaleUp.stabilizationWindowSeconds }}
      policies:
      - type: Pods
        value: {{ .Values.hpa.scaleUp.maxPodScaleUp }}
        periodSeconds: {{ .Values.hpa.scaleUp.periodSeconds }}
      - type: Percent
        value: {{ .Values.hpa.scaleUp.percentScaleUp }}
        periodSeconds: {{ .Values.hpa.scaleUp.periodSeconds }}
    scaleDown:
      stabilizationWindowSeconds: {{ .Values.hpa.scaleDown.stabilizationWindowSeconds }}
      policies:
      - type: Pods
        value: {{ .Values.hpa.scaleDown.maxPodScaleDown }}
        periodSeconds: {{ .Values.hpa.scaleDown.periodSeconds }}
      - type: Percent
        value: {{ .Values.hpa.scaleDown.percentScaleDown }}
        periodSeconds: {{ .Values.hpa.scaleDown.periodSeconds }}
{{- end }}
