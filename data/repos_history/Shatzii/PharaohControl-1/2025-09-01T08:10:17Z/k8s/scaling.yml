apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pharaoh-app-hpa
  namespace: pharaoh-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pharaoh-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: pharaoh-system
data:
  nginx.conf: |
    events {
      worker_connections 1024;
    }

    http {
      upstream pharaoh_app {
        server pharaoh-app-service:80;
      }

      server {
        listen 80;
        server_name localhost;

        location / {
          proxy_pass http://pharaoh_app;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;

          # WebSocket support
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
        }

        # Health check endpoint
        location /health {
          access_log off;
          return 200 "healthy\n";
          add_header Content-Type text/plain;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharaoh-nginx
  namespace: pharaoh-system
  labels:
    app: pharaoh-nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pharaoh-nginx
  template:
    metadata:
      labels:
        app: pharaoh-nginx
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: pharaoh-nginx-service
  namespace: pharaoh-system
  labels:
    app: pharaoh-nginx
spec:
  selector:
    app: pharaoh-nginx
  ports:
  - name: http
    port: 80
    targetPort: 80
  type: LoadBalancer
