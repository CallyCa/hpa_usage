apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-gateway
  namespace: default
  labels:
    app: admin-gateway
    arch: outer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-gateway
  template:
    metadata:
      labels:
        app: admin-gateway
    spec:
      nodeSelector:
        app: rabbitmq-service
      containers:
        - name: admin-gateway
          image: sunwoo11/keywe_admin_gateway:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: SPRING_PROFILES_INCLUDE
              value: "actuator,swagger,security,redis,k8s-routes"

            - name: CONFIG_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: keywe-config
                  key: config-server-url

            - name: SPRING_RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: keywe-config
                  key: rabbitmq-host
            - name: SPRING_RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: keywe-config
                  key: rabbitmq-port
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keywe-secrets
                  key: rabbitmq-username
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keywe-secrets
                  key: rabbitmq-password

            - name: EUREKA_HOST
              valueFrom:
                configMapKeyRef:
                  name: keywe-config
                  key: eureka-host
            - name: EUREKA_PORT
              valueFrom:
                configMapKeyRef:
                  name: keywe-config
                  key: eureka-port

            - name: JWT_ACCESS_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: keywe-secrets
                  key: jwt-access-token-secret

            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: keywe-config
                  key: admin-redis-host
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: keywe-config
                  key: admin-redis-port
            - name: REDIS_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: keywe-config
                  key: admin-redis-password

            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: keywe-config
                  key: admin-gateway-port

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "150m"
            limits:
              memory: "1Gi"
              cpu: "1"

---

apiVersion: v1
kind: Service
metadata:
  name: admin-gateway
  labels:
    app: admin-gateway
    arch: outer
spec:
  selector:
    app: admin-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8082
  type: ClusterIP