# Karpenter configuration for advanced node provisioning
# Provides intelligent and cost-effective node scaling

apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: kantorl-general
  namespace: karpenter
spec:
  # Template for provisioned nodes
  template:
    metadata:
      labels:
        node-type: general
        workload: kantorl
      annotations:
        node.kubernetes.io/exclude-from-external-load-balancers: "false"
    spec:
      # Node class reference
      nodeClassRef:
        apiVersion: karpenter.k8s.aws/v1beta1
        kind: EC2NodeClass
        name: kantorl-general
      
      # Resource requirements
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - m5.large
            - m5.xlarge
            - m5.2xlarge
            - m5a.large
            - m5a.xlarge
            - m5a.2xlarge
            - c5.large
            - c5.xlarge
            - c5.2xlarge
      
      # Startup and shutdown taints
      startupTaints:
        - key: node.kubernetes.io/not-ready
          effect: NoSchedule
      
      # Node properties
      expireAfter: 30m
      consolidationPolicy: WhenEmpty
      consolidateAfter: 30s
  
  # Scaling limits
  limits:
    cpu: 1000
    memory: 1000Gi
  
  # Disruption settings
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s
    expireAfter: 30m

---
# GPU Node Pool for training workloads
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: kantorl-gpu
  namespace: karpenter
spec:
  template:
    metadata:
      labels:
        node-type: gpu
        workload: training
        nvidia.com/gpu: "true"
      annotations:
        node.kubernetes.io/exclude-from-external-load-balancers: "true"
    spec:
      nodeClassRef:
        apiVersion: karpenter.k8s.aws/v1beta1
        kind: EC2NodeClass
        name: kantorl-gpu
      
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]  # GPU instances on-demand for stability
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - g4dn.xlarge
            - g4dn.2xlarge
            - g4dn.4xlarge
            - g4dn.8xlarge
            - p3.2xlarge
            - p3.8xlarge
      
      # GPU-specific taints
      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule
        - key: kantorl/training
          value: "true"
          effect: NoSchedule
      
      # Longer expiration for GPU nodes
      expireAfter: 60m
      consolidationPolicy: WhenEmpty
      consolidateAfter: 60s
  
  limits:
    cpu: 500
    memory: 500Gi
    nvidia.com/gpu: 10
  
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 60s
    expireAfter: 60m

---
# Spot Instance Node Pool for cost optimization
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: kantorl-spot
  namespace: karpenter
spec:
  template:
    metadata:
      labels:
        node-type: spot
        workload: batch
        cost-optimization: "true"
    spec:
      nodeClassRef:
        apiVersion: karpenter.k8s.aws/v1beta1
        kind: EC2NodeClass
        name: kantorl-spot
      
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - m5.large
            - m5.xlarge
            - m5.2xlarge
            - m5.4xlarge
            - c5.large
            - c5.xlarge
            - c5.2xlarge
            - c5.4xlarge
            - r5.large
            - r5.xlarge
            - r5.2xlarge
      
      # Spot instance tolerations
      taints:
        - key: node.kubernetes.io/spot
          value: "true"
          effect: NoSchedule
      
      # Shorter expiration for spot instances
      expireAfter: 15m
      consolidationPolicy: WhenUnderutilized
      consolidateAfter: 15s
  
  limits:
    cpu: 2000
    memory: 2000Gi
  
  disruption:
    consolidationPolicy: WhenUnderutilized
    consolidateAfter: 15s
    expireAfter: 15m

---
# EC2 Node Class for general workloads
apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: kantorl-general
  namespace: karpenter
spec:
  # AMI configuration
  amiFamily: AL2
  
  # Instance profile
  role: "KarpenterNodeInstanceProfile"
  
  # Subnet configuration
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "kantorl-cluster"
        kubernetes.io/cluster/kantorl-cluster: "owned"
  
  # Security group configuration
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "kantorl-cluster"
  
  # User data for node initialization
  userData: |
    #!/bin/bash
    /etc/eks/bootstrap.sh kantorl-cluster
    
    # Install monitoring agents
    yum update -y
    yum install -y amazon-cloudwatch-agent
    
    # Configure node labels
    echo "node-type=general" >> /etc/kubernetes/kubelet/kubelet-config.json
    
    # Set up log forwarding
    /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
      -a fetch-config -m ec2 -s -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
  
  # Block device mappings
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        iops: 3000
        throughput: 125
        encrypted: true
        deleteOnTermination: true
  
  # Instance metadata options
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required
  
  # Tags
  tags:
    Name: "karpenter-kantorl-general"
    Environment: "production"
    Project: "kantorl"
    ManagedBy: "karpenter"
    NodeType: "general"

---
# EC2 Node Class for GPU workloads
apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: kantorl-gpu
  namespace: karpenter
spec:
  amiFamily: AL2_x86_64_GPU
  
  role: "KarpenterNodeInstanceProfile"
  
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "kantorl-cluster"
        kubernetes.io/cluster/kantorl-cluster: "owned"
  
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "kantorl-cluster"
  
  userData: |
    #!/bin/bash
    /etc/eks/bootstrap.sh kantorl-cluster
    
    # Install NVIDIA drivers and Docker runtime
    yum update -y
    yum install -y nvidia-docker2
    
    # Configure NVIDIA container runtime
    systemctl restart docker
    
    # Install GPU monitoring
    yum install -y nvidia-ml-py
    
    # Set up GPU metrics collection
    echo "gpu-enabled=true" >> /etc/kubernetes/kubelet/kubelet-config.json
  
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        iops: 3000
        throughput: 250
        encrypted: true
        deleteOnTermination: true
  
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required
  
  tags:
    Name: "karpenter-kantorl-gpu"
    Environment: "production"
    Project: "kantorl"
    ManagedBy: "karpenter"
    NodeType: "gpu"
    GPUEnabled: "true"

---
# EC2 Node Class for spot instances
apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: kantorl-spot
  namespace: karpenter
spec:
  amiFamily: AL2
  
  role: "KarpenterNodeInstanceProfile"
  
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "kantorl-cluster"
        kubernetes.io/cluster/kantorl-cluster: "owned"
  
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "kantorl-cluster"
  
  userData: |
    #!/bin/bash
    /etc/eks/bootstrap.sh kantorl-cluster
    
    # Configure for spot instances
    yum update -y
    
    # Install spot instance handler
    curl -O https://raw.githubusercontent.com/aws/aws-node-termination-handler/main/scripts/install-aws-node-termination-handler
    chmod +x install-aws-node-termination-handler
    ./install-aws-node-termination-handler
    
    # Set up graceful shutdown
    echo "spot-instance=true" >> /etc/kubernetes/kubelet/kubelet-config.json
  
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 30Gi
        volumeType: gp3
        iops: 3000
        throughput: 125
        encrypted: true
        deleteOnTermination: true
  
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required
  
  tags:
    Name: "karpenter-kantorl-spot"
    Environment: "production"
    Project: "kantorl"
    ManagedBy: "karpenter"
    NodeType: "spot"
    CostOptimized: "true"

---
# Karpenter configuration for the controller
apiVersion: v1
kind: ConfigMap
metadata:
  name: karpenter-global-settings
  namespace: karpenter
data:
  # Global settings for Karpenter
  aws.clusterName: "kantorl-cluster"
  aws.defaultInstanceProfile: "KarpenterNodeInstanceProfile"
  aws.enablePodENI: "false"
  aws.enableIPv6: "false"
  aws.isolatedVPC: "false"
  aws.nodeNameConvention: "ip-name"
  aws.vmMemoryOverheadPercent: "0.075"
  
  # Interruption handling
  aws.interruptionQueueName: "kantorl-cluster"
  
  # Feature gates
  featureGates.driftEnabled: "true"
  featureGates.spotToSpotConsolidation: "true"
  
  # Logging
  logging.level: "info"
  
  # Metrics
  metrics.port: "8080"
  
  # Health probes
  health.probePort: "8081"

---
# Service Monitor for Karpenter metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: karpenter
  namespace: karpenter
  labels:
    app.kubernetes.io/name: karpenter
spec:
  endpoints:
    - port: http-metrics
      interval: 30s
      path: /metrics
  namespaceSelector:
    matchNames:
      - karpenter
  selector:
    matchLabels:
      app.kubernetes.io/name: karpenter

---
# Cluster Autoscaler configuration (fallback)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-autoscaler
  namespace: kube-system
  labels:
    app: cluster-autoscaler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-autoscaler
  template:
    metadata:
      labels:
        app: cluster-autoscaler
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8085"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: cluster-autoscaler
      containers:
        - image: k8s.gcr.io/autoscaling/cluster-autoscaler:v1.28.2
          name: cluster-autoscaler
          resources:
            limits:
              cpu: 100m
              memory: 600Mi
            requests:
              cpu: 100m
              memory: 600Mi
          command:
            - ./cluster-autoscaler
            - --v=4
            - --stderrthreshold=info
            - --cloud-provider=aws
            - --skip-nodes-with-local-storage=false
            - --expander=least-waste
            - --node-group-auto-discovery=asg:tag=k8s.io/cluster-autoscaler/enabled,k8s.io/cluster-autoscaler/kantorl-cluster
            - --balance-similar-node-groups
            - --skip-nodes-with-system-pods=false
            - --scale-down-enabled=true
            - --scale-down-delay-after-add=10m
            - --scale-down-unneeded-time=10m
            - --scale-down-utilization-threshold=0.5
            - --max-node-provision-time=15m
            - --scan-interval=10s
          volumeMounts:
            - name: ssl-certs
              mountPath: /etc/ssl/certs/ca-certificates.crt
              readOnly: true
          imagePullPolicy: "Always"
          env:
            - name: AWS_REGION
              value: us-west-2
      volumes:
        - name: ssl-certs
          hostPath:
            path: "/etc/ssl/certs/ca-bundle.crt"
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      tolerations:
        - operator: "Exists"

---
# Vertical Pod Autoscaler configuration
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: kantorl-api-vpa
  namespace: kantorl
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kantorl-api
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: kantorl-api
        minAllowed:
          cpu: "0.1"
          memory: "128Mi"
        maxAllowed:
          cpu: "2"
          memory: "4Gi"
        controlledResources: ["cpu", "memory"]
        controlledValues: RequestsAndLimits

---
# Horizontal Pod Autoscaler with custom metrics
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kantorl-api-hpa-advanced
  namespace: kantorl
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kantorl-api
  minReplicas: 2
  maxReplicas: 20
  metrics:
    # CPU utilization
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    
    # Memory utilization
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    
    # Custom metric: requests per second
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "100"
    
    # External metric: SQS queue length
    - type: External
      external:
        metric:
          name: sqs_queue_length
          selector:
            matchLabels:
              queue_name: "training-jobs"
        target:
          type: AverageValue
          averageValue: "10"
  
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
