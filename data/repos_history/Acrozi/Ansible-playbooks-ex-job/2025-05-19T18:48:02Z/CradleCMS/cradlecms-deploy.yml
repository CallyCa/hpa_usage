---
- name: Deploy CradleCMS Full Stack to Kubernetes
  hosts: localhost
  gather_facts: no
  tasks:

    - name: Create cradlecms Namespace
      community.kubernetes.k8s:
        kubeconfig: "{{ lookup('env', 'KUBECONFIG') }}"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: cradlecms

    - name: Create ConfigMap for CradleCMS settings (site)
      community.kubernetes.k8s:
        kubeconfig: "{{ lookup('env', 'KUBECONFIG') }}"
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: cradlecms-settings
            namespace: cradlecms
          data:
            settings.conf: "{{ lookup('file', './settings.conf') }}"

    - name: Deploy CradleCMS Site
      community.kubernetes.k8s:
        kubeconfig: "{{ lookup('env', 'KUBECONFIG') }}"
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: cradlecms-site
            namespace: cradlecms
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: cradlecms-site
            template:
              metadata:
                labels:
                  app: cradlecms-site
              spec:
                containers:
                  - name: cradlecms-site
                    image: registry.cradlecms.com:5000/site:test
                    imagePullPolicy: Always 
                    env:
                      - name: BACKEND_URL
                        value: "nats://my-nats-headless.default.svc.cluster.local:4222"
                      - name: SITE_DEBUG
                        value: "on"
                    volumeMounts:
                      - name: cradlecms-settings-volume
                        mountPath: /app/settings.conf
                        subPath: settings.conf
                        readOnly: true
                imagePullSecrets:
                  - name: cradlecms-registry-secret
                volumes:
                  - name: cradlecms-settings-volume
                    configMap:
                      name: cradlecms-settings

    - name: Deploy CradleCMS Admin
      community.kubernetes.k8s:
        kubeconfig: "{{ lookup('env', 'KUBECONFIG') }}"
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: cradlecms-admin
            namespace: cradlecms
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: cradlecms-admin
            template:
              metadata:
                labels:
                  app: cradlecms-admin
              spec:
                containers:
                  - name: cradlecms-admin
                    image: registry.cradlecms.com:5000/admin-cms:test
                    imagePullPolicy: Always
                    env:
                      - name: BACKEND_URL
                        value: "nats://my-nats-headless.default.svc.cluster.local:4222"
                    ports:
                      - containerPort: 8888
                imagePullSecrets:
                  - name: cradlecms-registry-secret


    - name: Deploy CradleCMS Frontend
      community.kubernetes.k8s:
        kubeconfig: "{{ lookup('env', 'KUBECONFIG') }}"
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: cradlecms-frontend
            namespace: cradlecms
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: cradlecms-frontend
            template:
              metadata:
                labels:
                  app: cradlecms-frontend
              spec:
                containers:
                  - name: cradlecms-frontend
                    imagePullPolicy: IfNotPresent
                    image: registry.cradlecms.com:5000/frontend:test
                    env:
                      - name: BACKEND_URL
                        value: "nats://my-nats-headless.default.svc.cluster.local:4222"
                    ports:
                      - containerPort: 4040
                    resources:
                      requests:
                        cpu: "100m"
                        memory: "200Mi"
                      limits:
                        cpu: "1000m"
                        memory: "500Mi"
                imagePullSecrets:
                  - name: cradlecms-registry-secret



    - name: Create ClusterIP Service for cradlecms-admin (internal)
      community.kubernetes.k8s:
        kubeconfig: "{{ lookup('env', 'KUBECONFIG') }}"
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: cradlecms-admin
            namespace: cradlecms
          spec:
#            externalTrafficPolicy: Local
            type: ClusterIP
            selector:
              app: cradlecms-admin
            ports:
              - protocol: TCP
                port: 8888
                targetPort: 8888
            sessionAffinity: ClientIP

    - name: Create LoadBalancer Service for cradlecms-frontend (external)
      community.kubernetes.k8s:
        kubeconfig: "{{ lookup('env', 'KUBECONFIG') }}"
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: cradlecms-frontend
            namespace: cradlecms
          spec:
            externalTrafficPolicy: Local
            type: LoadBalancer
            #loadBalancerIP: 192.168.68.56
            selector:
              app: cradlecms-frontend
            ports:
              - protocol: TCP
                port: 443
                targetPort: 4040
            sessionAffinity: ClientIP

    - name: Create HorizontalPodAutoscaler for cradlecms-frontend
      community.kubernetes.k8s:
        kubeconfig: "{{ lookup('env', 'KUBECONFIG') }}"
        state: present
        definition:
          apiVersion: autoscaling/v2
          kind: HorizontalPodAutoscaler
          metadata:
            name: cradlecms-frontend-hpa
            namespace: cradlecms
          spec:
            scaleTargetRef:
              apiVersion: apps/v1
              kind: Deployment
              name: cradlecms-frontend
            minReplicas: 1
            maxReplicas: 10
            metrics:
              - type: Resource
                resource:
                  name: cpu
                  target:
                    type: Utilization
                    averageUtilization: 20
