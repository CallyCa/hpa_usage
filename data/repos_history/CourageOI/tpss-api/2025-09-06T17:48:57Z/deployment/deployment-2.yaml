apiVersion: v1
kind: Service
metadata:
  name: demo-stable
spec:
  selector:
    app: tpss-rollout-demo
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: demo-canary
spec:
  selector:
    app: tpss-rollout-demo
  ports:
    - name: http
      port: 80
      targetPort: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpss-deployment-demo
  annotations:
    sidecar.istio.io/inject: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: tpss-demo
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "true"
      labels:
        app: tpss-demo
    spec:
      containers:
        - name: tpss-demo
          image: nginx
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "20m"
              memory: "20Mi"
            limits:
              cpu: "50m"
              memory: "50Mi"

