# Vindex Chain - Kubernetes Production Deployment
# Complete production-ready Kubernetes configuration

apiVersion: v1
kind: Namespace
metadata:
  name: vindex-chain
  labels:
    name: vindex-chain
    environment: production

---
# ConfigMap for shared environment variables
apiVersion: v1
kind: ConfigMap
metadata:
  name: vindex-config
  namespace: vindex-chain
data:
  NODE_ENV: "production"
  BLOCKCHAIN_API_URL: "http://blockchain-core-service:3001"
  CORS_ORIGIN: "https://wallet.vindex.io,https://explorer.vindex.io,https://admin.vindex.io"

---
# Secret for sensitive data
apiVersion: v1
kind: Secret
metadata:
  name: vindex-secrets
  namespace: vindex-chain
type: Opaque
data:
  DATABASE_URL: cG9zdGdyZXNxbDovL3ZpbmRleDp2aW5kZXhfcGFzc3dvcmRAcG9zdGdyZXM6NTQzMi92aW5kZXhfY2hhaW4=  # base64 encoded
  JWT_SECRET: dGhpc19pc19hX3NlY3VyZV9qd3Rfc2VjcmV0X2tleV8yMDI0  # base64 encoded
  NEXTAUTH_SECRET: dGhpc19pc19hX3NlY3VyZV9uZXh0YXV0aF9zZWNyZXRfMjAyNA==  # base64 encoded

---
# PostgreSQL Database
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: vindex-chain
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: vindex_chain
        - name: POSTGRES_USER
          value: vindex
        - name: POSTGRES_PASSWORD
          value: vindex_password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - vindex
            - -d
            - vindex_chain
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - vindex
            - -d
            - vindex_chain
          initialDelaySeconds: 5
          periodSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 50Gi

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: vindex-chain
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
  clusterIP: None

---
# Redis Cache
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: vindex-chain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: vindex-chain
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379

---
# Blockchain Core Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockchain-core
  namespace: vindex-chain
spec:
  replicas: 3
  selector:
    matchLabels:
      app: blockchain-core
  template:
    metadata:
      labels:
        app: blockchain-core
    spec:
      containers:
      - name: blockchain-core
        image: vindex/blockchain-core:latest
        env:
        - name: PORT
          value: "3001"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: vindex-secrets
              key: DATABASE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: vindex-secrets
              key: JWT_SECRET
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        envFrom:
        - configMapRef:
            name: vindex-config
        ports:
        - containerPort: 3001
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3001
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: blockchain-core-service
  namespace: vindex-chain
spec:
  selector:
    app: blockchain-core
  ports:
  - port: 3001
    targetPort: 3001

---
# Wallet App
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-app
  namespace: vindex-chain
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wallet-app
  template:
    metadata:
      labels:
        app: wallet-app
    spec:
      containers:
      - name: wallet-app
        image: vindex/wallet-app:latest
        env:
        - name: PORT
          value: "3000"
        - name: NEXTAUTH_URL
          value: "https://wallet.vindex.io"
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: vindex-secrets
              key: NEXTAUTH_SECRET
        envFrom:
        - configMapRef:
            name: vindex-config
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: wallet-app-service
  namespace: vindex-chain
spec:
  selector:
    app: wallet-app
  ports:
  - port: 3000
    targetPort: 3000

---
# Explorer
apiVersion: apps/v1
kind: Deployment
metadata:
  name: explorer
  namespace: vindex-chain
spec:
  replicas: 2
  selector:
    matchLabels:
      app: explorer
  template:
    metadata:
      labels:
        app: explorer
    spec:
      containers:
      - name: explorer
        image: vindex/explorer:latest
        env:
        - name: PORT
          value: "3001"
        - name: NEXTAUTH_URL
          value: "https://explorer.vindex.io"
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: vindex-secrets
              key: NEXTAUTH_SECRET
        envFrom:
        - configMapRef:
            name: vindex-config
        ports:
        - containerPort: 3001
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: explorer-service
  namespace: vindex-chain
spec:
  selector:
    app: explorer
  ports:
  - port: 3001
    targetPort: 3001

---
# Admin Dashboard
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-dashboard
  namespace: vindex-chain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-dashboard
  template:
    metadata:
      labels:
        app: admin-dashboard
    spec:
      containers:
      - name: admin-dashboard
        image: vindex/admin-dashboard:latest
        env:
        - name: PORT
          value: "3002"
        - name: NEXTAUTH_URL
          value: "https://admin.vindex.io"
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: vindex-secrets
              key: NEXTAUTH_SECRET
        envFrom:
        - configMapRef:
            name: vindex-config
        ports:
        - containerPort: 3002
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3002
          initialDelaySeconds: 30
          periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: admin-dashboard-service
  namespace: vindex-chain
spec:
  selector:
    app: admin-dashboard
  ports:
  - port: 3002
    targetPort: 3002

---
# Ingress for external access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vindex-ingress
  namespace: vindex-chain
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
  - hosts:
    - wallet.vindex.io
    - explorer.vindex.io
    - admin.vindex.io
    - api.vindex.io
    secretName: vindex-tls
  rules:
  - host: wallet.vindex.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wallet-app-service
            port:
              number: 3000
  - host: explorer.vindex.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: explorer-service
            port:
              number: 3001
  - host: admin.vindex.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: admin-dashboard-service
            port:
              number: 3002
  - host: api.vindex.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: blockchain-core-service
            port:
              number: 3001

---
# Horizontal Pod Autoscaler for blockchain core
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: blockchain-core-hpa
  namespace: vindex-chain
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: blockchain-core
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
