apiVersion: v1
kind: ServiceAccount
metadata:
  name: novaforge-app
  namespace: novaforge
  labels:
    app.kubernetes.io/name: novaforge
    app.kubernetes.io/component: application
automountServiceAccountToken: true

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: novaforge-lb
  namespace: novaforge
  labels:
    app.kubernetes.io/name: novaforge
    app.kubernetes.io/component: loadbalancer
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: novaforge-db-operator
  namespace: novaforge
  labels:
    app.kubernetes.io/name: novaforge
    app.kubernetes.io/component: database
automountServiceAccountToken: true

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: novaforge-monitoring
  namespace: novaforge
  labels:
    app.kubernetes.io/name: novaforge
    app.kubernetes.io/component: monitoring
automountServiceAccountToken: true

---
# Cluster Role for NovaForge Application
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: novaforge-app-cluster-role
  labels:
    app.kubernetes.io/name: novaforge
    app.kubernetes.io/component: application
rules:
# Read-only access to nodes for resource monitoring
- apiGroups: [""]
  resources: ["nodes", "nodes/stats", "nodes/metrics"]
  verbs: ["get", "list"]
# Access to own namespace resources
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "configmaps"]
  verbs: ["get", "list", "watch"]
# Access to metrics
- apiGroups: ["metrics.k8s.io"]
  resources: ["nodes", "pods"]
  verbs: ["get", "list"]

---
# Role for NovaForge Application (namespace-scoped)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: novaforge-app-role
  namespace: novaforge
  labels:
    app.kubernetes.io/name: novaforge
    app.kubernetes.io/component: application
rules:
# Full access to application resources
- apiGroups: [""]
  resources: ["pods", "pods/log", "pods/status"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["services", "endpoints"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
# Access to deployments for scaling
- apiGroups: ["apps"]
  resources: ["deployments", "deployments/scale"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["apps"]
  resources: ["replicasets", "statefulsets"]
  verbs: ["get", "list", "watch"]
# Access to HPA for autoscaling
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
# Access to events for monitoring
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch"]

---
# Role for Database Operations
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: novaforge-db-operator-role
  namespace: novaforge
  labels:
    app.kubernetes.io/name: novaforge
    app.kubernetes.io/component: database
rules:
# Database pod management
- apiGroups: [""]
  resources: ["pods", "pods/exec"]
  verbs: ["get", "list", "watch", "create", "delete"]
  resourceNames: ["postgres-primary-*", "postgres-replica-*", "redis-*"]
# PVC management for database
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
# StatefulSet management
- apiGroups: ["apps"]
  resources: ["statefulsets"]
  verbs: ["get", "list", "watch", "update", "patch"]
# Backup job management
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
# Role for Monitoring
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: novaforge-monitoring-role
  namespace: novaforge
  labels:
    app.kubernetes.io/name: novaforge
    app.kubernetes.io/component: monitoring
rules:
# Read access to all resources for monitoring
- apiGroups: [""]
  resources: ["*"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["*"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["extensions"]
  resources: ["*"]
  verbs: ["get", "list", "watch"]
# Access to metrics APIs
- apiGroups: ["metrics.k8s.io"]
  resources: ["*"]
  verbs: ["get", "list"]

---
# Cluster Role Binding for NovaForge Application
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: novaforge-app-cluster-binding
  labels:
    app.kubernetes.io/name: novaforge
    app.kubernetes.io/component: application
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: novaforge-app-cluster-role
subjects:
- kind: ServiceAccount
  name: novaforge-app
  namespace: novaforge

---
# Role Binding for NovaForge Application
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: novaforge-app-binding
  namespace: novaforge
  labels:
    app.kubernetes.io/name: novaforge
    app.kubernetes.io/component: application
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: novaforge-app-role
subjects:
- kind: ServiceAccount
  name: novaforge-app
  namespace: novaforge

---
# Role Binding for Database Operator
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: novaforge-db-operator-binding
  namespace: novaforge
  labels:
    app.kubernetes.io/name: novaforge
    app.kubernetes.io/component: database
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: novaforge-db-operator-role
subjects:
- kind: ServiceAccount
  name: novaforge-db-operator
  namespace: novaforge

---
# Role Binding for Monitoring
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: novaforge-monitoring-binding
  namespace: novaforge
  labels:
    app.kubernetes.io/name: novaforge
    app.kubernetes.io/component: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: novaforge-monitoring-role
subjects:
- kind: ServiceAccount
  name: novaforge-monitoring
  namespace: novaforge

---
# Pod Security Policy for NovaForge (if PSP is enabled)
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: novaforge-psp
  labels:
    app.kubernetes.io/name: novaforge
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  allowedCapabilities:
    - NET_BIND_SERVICE
  volumes:
    - 'configMap'
    - 'emptyDir'
    - 'projected'
    - 'secret'
    - 'downwardAPI'
    - 'persistentVolumeClaim'
  hostNetwork: false
  hostIPC: false
  hostPID: false
  runAsUser:
    rule: 'MustRunAsNonRoot'
  seLinux:
    rule: 'RunAsAny'
  supplementalGroups:
    rule: 'MustRunAs'
    ranges:
      - min: 1
        max: 65535
  fsGroup:
    rule: 'MustRunAs'
    ranges:
      - min: 1
        max: 65535
  readOnlyRootFilesystem: false

---
# Pod Security Policy for Database
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: novaforge-db-psp
  labels:
    app.kubernetes.io/name: novaforge
    app.kubernetes.io/component: database
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  volumes:
    - 'configMap'
    - 'emptyDir'
    - 'projected'
    - 'secret'
    - 'downwardAPI'
    - 'persistentVolumeClaim'
  hostNetwork: false
  hostIPC: false
  hostPID: false
  runAsUser:
    rule: 'MustRunAs'
    ranges:
      - min: 999
        max: 999
  seLinux:
    rule: 'RunAsAny'
  supplementalGroups:
    rule: 'MustRunAs'
    ranges:
      - min: 999
        max: 999
  fsGroup:
    rule: 'MustRunAs'
    ranges:
      - min: 999
        max: 999
  readOnlyRootFilesystem: false

---
# Cluster Role for PSP
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: novaforge-psp-role
rules:
- apiGroups: ['policy']
  resources: ['podsecuritypolicies']
  verbs: ['use']
  resourceNames:
    - novaforge-psp
    - novaforge-db-psp

---
# Cluster Role Binding for PSP
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: novaforge-psp-binding
roleRef:
  kind: ClusterRole
  name: novaforge-psp-role
  apiGroup: rbac.authorization.k8s.io
subjects:
- kind: ServiceAccount
  name: novaforge-app
  namespace: novaforge
- kind: ServiceAccount
  name: novaforge-lb
  namespace: novaforge
- kind: ServiceAccount
  name: novaforge-db-operator
  namespace: novaforge
- kind: ServiceAccount
  name: novaforge-monitoring
  namespace: novaforge

---
# Network Policy for Application Security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: novaforge-default-deny
  namespace: novaforge
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress

---
# Network Policy for Database Access
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: novaforge-db-access
  namespace: novaforge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: database
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: novaforge
          app.kubernetes.io/component: application
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: monitoring
    ports:
    - protocol: TCP
      port: 9187
    - protocol: TCP
      port: 9121

---
# Network Policy for Load Balancer Access
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: novaforge-lb-access
  namespace: novaforge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: loadbalancer
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - {}  # Allow all ingress traffic to load balancer
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: novaforge
          app.kubernetes.io/component: application
    ports:
    - protocol: TCP
      port: 3000
  - to: []  # Allow all egress for external dependencies
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53

---
# Network Policy for Monitoring Access
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: novaforge-monitoring-access
  namespace: novaforge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: monitoring
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from: []  # Allow access from anywhere to monitoring endpoints
    ports:
    - protocol: TCP
      port: 3000
    - protocol: TCP
      port: 9090
    - protocol: TCP
      port: 16686
    - protocol: TCP
      port: 5601
  egress:
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 9090
    - protocol: TCP
      port: 9187
    - protocol: TCP
      port: 9121
    - protocol: TCP
      port: 9113