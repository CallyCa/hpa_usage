  name: git-credentials
  namespace: nova-forge-governance
  labels:
    app: opa-server
    component: policy-engine
type: Opaque
data:
  .gitconfig: W2NvcmVdCiAgICBhdXRvY3JsZiA9IGZhbHNlCltjcmVkZW50aWFsXQogICAgaGVscGVyID0gc3RvcmU=  # [core]\n    autocrlf = false\n[credential]\n    helper = store
  .git-credentials: aHR0cHM6Ly9ub3ZhLWZvcmdlOmdocF9FeGFtcGxlVG9rZW4xMjNAZ2l0aHViLmNvbQ==  # https://nova-forge:ghp_ExampleToken123@github.com
