apiVersion: v1
kind: Namespace
metadata:
  name: nova-forge-governance
  labels:
    name: nova-forge-governance
    component: policy-engine
    layer: infrastructure
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa-server-cluster
  namespace: nova-forge-governance
  labels:
    app: opa-server
    component: policy-engine
    layer: infrastructure
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: opa-server
  template:
    metadata:
      labels:
        app: opa-server
        component: policy-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8181"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: opa-server
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - opa-server
              topologyKey: kubernetes.io/hostname
      containers:
      - name: opa-server
        image: openpolicyagent/opa:latest-envoy
        imagePullPolicy: Always
        ports:
        - containerPort: 8181
          name: http-api
          protocol: TCP
        - containerPort: 8282
          name: diagnostic
          protocol: TCP
        - containerPort: 9191
          name: envoy-ext-authz
          protocol: TCP
        env:
        - name: OPA_LOG_LEVEL
          value: "info"
        - name: OPA_LOG_FORMAT
          value: "json"
        - name: OPA_CONFIG_FILE
          value: "/config/opa-config.yaml"
        - name: OPA_BUNDLE_PREFIX
          value: "/bundles"
        - name: OPA_DECISION_LOG_CONSOLE
          value: "true"
        - name: OPA_STATUS_CONSOLE
          value: "true"
        args:
        - "run"
        - "--server"
        - "--config-file=/config/opa-config.yaml"
        - "--addr=0.0.0.0:8181"
        - "--diagnostic-addr=0.0.0.0:8282"
        - "--set=plugins.envoy_ext_authz_grpc.addr=0.0.0.0:9191"
        - "--set=plugins.envoy_ext_authz_grpc.enable_reflection=true"
        - "--set=decision_logs.console=true"
        - "--set=status.console=true"
        - "--set=bundles.authz.resource=/bundles/authz.tar.gz"
        - "--set=bundles.authz.service=bundle-server"
        - "--log-level=info"
        - "--log-format=json"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
            ephemeral-storage: "1Gi"
          limits:
            memory: "2Gi"
            cpu: "1000m"
            ephemeral-storage: "5Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: http-api
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health?bundle=true
            port: http-api
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: http-api
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 30
        volumeMounts:
        - name: opa-config
          mountPath: /config
          readOnly: true
        - name: opa-policies
          mountPath: /policies
          readOnly: true
        - name: opa-bundles
          mountPath: /bundles
        - name: opa-data
          mountPath: /data
        - name: tmp-volume
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      - name: bundle-server
        image: nginx:alpine
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: bundle-http
          protocol: TCP
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /bundles/
            port: bundle-http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /bundles/
            port: bundle-http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: opa-bundles
          mountPath: /usr/share/nginx/html/bundles
          readOnly: true
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - SETGID
            - SETUID
      - name: policy-manager
        image: nova-forge/opa-policy-manager:v1.0
        imagePullPolicy: Always
        ports:
        - containerPort: 9000
          name: manager-api
          protocol: TCP
        env:
        - name: OPA_SERVER_URL
          value: "http://localhost:8181"
        - name: BUNDLE_SERVER_URL
          value: "http://localhost:8080"
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: opa-secrets
              key: redis-url
        - name: GIT_REPO_URL
          valueFrom:
            secretKeyRef:
              name: opa-secrets
              key: git-repo-url
        - name: GIT_TOKEN
          valueFrom:
            secretKeyRef:
              name: opa-secrets
              key: git-token
        - name: WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: opa-secrets
              key: webhook-url
        - name: POLICY_VALIDATION_ENABLED
          value: "true"
        - name: AUTO_DEPLOY_ENABLED
          value: "true"
        - name: BACKUP_ENABLED
          value: "true"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: manager-cache
          mountPath: /app/cache
        - name: git-credentials
          mountPath: /app/git-credentials
          readOnly: true
      volumes:
      - name: opa-config
        configMap:
          name: opa-config
      - name: opa-policies
        configMap:
          name: opa-policies
      - name: opa-bundles
        persistentVolumeClaim:
          claimName: opa-bundles-pvc
      - name: opa-data
        persistentVolumeClaim:
          claimName: opa-data-pvc
      - name: nginx-config
        configMap:
          name: nginx-bundle-server-config
      - name: tmp-volume
        emptyDir:
          sizeLimit: 512Mi
      - name: manager-cache
        emptyDir:
          sizeLimit: 256Mi
      - name: git-credentials
        secret:
          secretName: git-credentials
      nodeSelector:
        workload-type: governance
      tolerations:
      - key: "governance-workload"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa-gatekeeper
  namespace: nova-forge-governance
  labels:
    app: opa-gatekeeper
    component: policy-engine
    layer: infrastructure
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: opa-gatekeeper
  template:
    metadata:
      labels:
        app: opa-gatekeeper
        component: policy-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8888"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: opa-gatekeeper
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: gatekeeper-controller
        image: openpolicyagent/gatekeeper:release-3.14
        imagePullPolicy: Always
        ports:
        - containerPort: 8443
          name: webhook-api
          protocol: TCP
        - containerPort: 8888
          name: metrics
          protocol: TCP
        - containerPort: 9090
          name: healthz
          protocol: TCP
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: CONTAINER_NAME
          value: "gatekeeper-controller"
        - name: WATCH_NAMESPACE
          value: ""
        - name: LOG_LEVEL
          value: "INFO"
        - name: ENABLE_MUTATION
          value: "true"
        - name: ENABLE_EXTERNAL_DATA
          value: "true"
        - name: METRICS_BACKEND
          value: "prometheus"
        args:
        - --port=8443
        - --logtostderr
        - --log-denies=true
        - --emit-admission-events=true
        - --log-level=INFO
        - --constraint-violations-limit=20
        - --audit-interval=60
        - --enable-external-data=true
        - --metrics-backend=prometheus
        - --disable-cert-rotation=false
        - --max-serving-threads=100
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
            ephemeral-storage: "1Gi"
          limits:
            memory: "2Gi"
            cpu: "1000m"
            ephemeral-storage: "5Gi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: healthz
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: healthz
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: gatekeeper-webhook-server-cert
          mountPath: /tmp/k8s-webhook-server/serving-certs
          readOnly: true
        - name: gatekeeper-config
          mountPath: /config
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: gatekeeper-webhook-server-cert
        secret:
          secretName: gatekeeper-webhook-server-cert
      - name: gatekeeper-config
        configMap:
          name: gatekeeper-config
      nodeSelector:
        workload-type: governance
      tolerations:
      - key: "governance-workload"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
---
apiVersion: v1
kind: Service
metadata:
  name: opa-server-service
  namespace: nova-forge-governance
  labels:
    app: opa-server
    component: policy-engine
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8181"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: opa-server
  ports:
  - name: http-api
    port: 8181
    targetPort: 8181
    protocol: TCP
  - name: diagnostic
    port: 8282
    targetPort: 8282
    protocol: TCP
  - name: envoy-ext-authz
    port: 9191
    targetPort: 9191
    protocol: TCP
  - name: bundle-http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: manager-api
    port: 9000
    targetPort: 9000
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: opa-gatekeeper-service
  namespace: nova-forge-governance
  labels:
    app: opa-gatekeeper
    component: policy-engine
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8888"
spec:
  selector:
    app: opa-gatekeeper
  ports:
  - name: webhook-api
    port: 443
    targetPort: 8443
    protocol: TCP
  - name: metrics
    port: 8888
    targetPort: 8888
    protocol: TCP
  - name: healthz
    port: 9090
    targetPort: 9090
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opa-server
  namespace: nova-forge-governance
  labels:
    app: opa-server
    component: policy-engine
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opa-gatekeeper
  namespace: nova-forge-governance
  labels:
    app: opa-gatekeeper
    component: policy-engine
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opa-server-role
  labels:
    app: opa-server
    component: policy-engine
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["policy"]
  resources: ["podsecuritypolicies"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opa-gatekeeper-role
  labels:
    app: opa-gatekeeper
    component: policy-engine
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["config.gatekeeper.sh"]
  resources: ["*"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["templates.gatekeeper.sh"]
  resources: ["*"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["constraints.gatekeeper.sh"]
  resources: ["*"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["mutations.gatekeeper.sh"]
  resources: ["*"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["validatingadmissionwebhooks", "mutatingadmissionwebhooks"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opa-server-binding
  labels:
    app: opa-server
    component: policy-engine
subjects:
- kind: ServiceAccount
  name: opa-server
  namespace: nova-forge-governance
roleRef:
  kind: ClusterRole
  name: opa-server-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opa-gatekeeper-binding
  labels:
    app: opa-gatekeeper
    component: policy-engine
subjects:
- kind: ServiceAccount
  name: opa-gatekeeper
  namespace: nova-forge-governance
roleRef:
  kind: ClusterRole
  name: opa-gatekeeper-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opa-bundles-pvc
  namespace: nova-forge-governance
  labels:
    app: opa-server
    component: policy-engine
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: fast-ssd
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opa-data-pvc
  namespace: nova-forge-governance
  labels:
    app: opa-server
    component: policy-engine
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: fast-ssd
---
