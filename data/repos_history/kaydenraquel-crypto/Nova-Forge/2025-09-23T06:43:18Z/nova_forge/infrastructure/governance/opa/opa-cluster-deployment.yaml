  git-token: Z2hwX0V4YW1wbGVUb2tlbjEyMw==  # ghp_ExampleToken123
  webhook-url: aHR0cDovL3dlYmhvb2stc2VydmljZS9wb2xpY3ktcmVzdWx0cw==  # http://webhook-service/policy-results
