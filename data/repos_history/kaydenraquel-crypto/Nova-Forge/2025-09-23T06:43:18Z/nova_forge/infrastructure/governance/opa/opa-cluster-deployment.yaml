  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t  # Base64 encoded certificate
  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0t  # Base64 encoded private key
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-config
  namespace: nova-forge-governance
  labels:
    app: opa-server
    component: policy-engine
data:
  opa-config.yaml: |
    services:
      bundle-server:
        url: http://localhost:8080

    bundles:
      authz:
        service: bundle-server
        resource: /bundles/authz.tar.gz
        persist: true
        polling:
          min_delay_seconds: 10
          max_delay_seconds: 20
        signing:
          keyid: nova-forge-bundle-key
          scope: write

    decision_logs:
      console: true
      reporting:
        min_delay_seconds: 5
        max_delay_seconds: 10

    status:
      console: true
      service: bundle-server

    plugins:
      envoy_ext_authz_grpc:
        addr: :9191
        enable_reflection: true
        query: data.envoy.authz.allow
        dry_run: false
        enable_performance_metrics: true

    server:
      encoding:
        gzip:
          min_length: 1024
      metrics:
        prom: true

    storage:
      disk:
        directory: /data

    caching:
      inter_query_builtin_cache:
        max_size_bytes: 100000000

    nd_builtin_cache: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-policies
  namespace: nova-forge-governance
  labels:
    app: opa-server
    component: policy-engine
data:
  authz.rego: |
    package envoy.authz

    import future.keywords.if
    import future.keywords.in

    default allow := false

    # Allow health check endpoints
    allow if {
        input.attributes.request.http.method == "GET"
        startswith(input.attributes.request.http.path, "/health")
    }

    # Allow metrics endpoints
    allow if {
        input.attributes.request.http.method == "GET"
        startswith(input.attributes.request.http.path, "/metrics")
    }

    # Allow authenticated API requests
    allow if {
        is_authenticated
        is_authorized
    }

    is_authenticated if {
        token := bearer_token
        jwt.verify_rs256(token, jwks_data)
    }

    is_authorized if {
        user_has_permission
    }

    bearer_token := t if {
        auth_header := input.attributes.request.http.headers.authorization
        startswith(auth_header, "Bearer ")
        t := substring(auth_header, 7, -1)
    }

    user_has_permission if {
        user_roles := jwt.decode(bearer_token)[1].roles
        required_role := path_to_role_mapping[input.attributes.request.http.path]
        required_role in user_roles
    }

    path_to_role_mapping := {
        "/api/v1/admin": "admin",
        "/api/v1/users": "user",
        "/api/v1/data": "analyst",
        "/api/v1/config": "admin"
    }

    jwks_data := `{
        "keys": [
            {
                "kty": "RSA",
                "use": "sig",
                "kid": "nova-forge-key-1",
                "n": "example-modulus",
                "e": "AQAB"
            }
        ]
    }`

  security.rego: |
    package kubernetes.admission

    import future.keywords.if
    import future.keywords.in

    # Deny containers running as root
    deny[msg] if {
        input.request.kind.kind == "Pod"
        container := input.request.object.spec.containers[_]
        container.securityContext.runAsUser == 0
        msg := "Container must not run as root user"
    }

    # Require security contexts
    deny[msg] if {
        input.request.kind.kind == "Pod"
        container := input.request.object.spec.containers[_]
        not container.securityContext
        msg := "Container must define securityContext"
    }

    # Require resource limits
    deny[msg] if {
        input.request.kind.kind == "Pod"
        container := input.request.object.spec.containers[_]
        not container.resources.limits
        msg := "Container must define resource limits"
    }

    # Require non-privileged containers
    deny[msg] if {
        input.request.kind.kind == "Pod"
        container := input.request.object.spec.containers[_]
        container.securityContext.privileged == true
        msg := "Container must not be privileged"
    }

    # Require read-only root filesystem
    deny[msg] if {
        input.request.kind.kind == "Pod"
        container := input.request.object.spec.containers[_]
        container.securityContext.readOnlyRootFilesystem != true
        msg := "Container must use read-only root filesystem"
    }

    # Require dropping all capabilities
    deny[msg] if {
        input.request.kind.kind == "Pod"
        container := input.request.object.spec.containers[_]
        not container.securityContext.capabilities.drop
        msg := "Container must drop all capabilities"
    }

    deny[msg] if {
        input.request.kind.kind == "Pod"
        container := input.request.object.spec.containers[_]
        "ALL" not in container.securityContext.capabilities.drop
        msg := "Container must drop ALL capabilities"
    }

  network.rego: |
    package kubernetes.admission

    import future.keywords.if
    import future.keywords.in

    # Require network policies for all namespaces
    deny[msg] if {
        input.request.kind.kind == "Namespace"
        not has_network_policy
        msg := "Namespace must have associated NetworkPolicy"
    }

    # Deny default service account usage
    deny[msg] if {
        input.request.kind.kind == "Pod"
        input.request.object.spec.serviceAccountName == "default"
        msg := "Pod must not use default service account"
    }

    # Require explicit service account
    deny[msg] if {
        input.request.kind.kind == "Pod"
        not input.request.object.spec.serviceAccountName
        msg := "Pod must specify serviceAccountName"
    }

    has_network_policy if {
        # This would be populated by external data provider
        # checking for NetworkPolicy resources in the namespace
        data.kubernetes.networkpolicies[input.request.object.metadata.namespace]
    }

  compliance.rego: |
    package kubernetes.admission

    import future.keywords.if
    import future.keywords.in

    # SOX Compliance - Audit logging required
    deny[msg] if {
        input.request.kind.kind == "Pod"
        not has_audit_logging
        msg := "Pod must enable audit logging for SOX compliance"
    }

    # GDPR Compliance - Data retention labels required
    deny[msg] if {
        input.request.kind.kind == "PersistentVolumeClaim"
        stores_personal_data
        not input.request.object.metadata.labels["data-retention-period"]
        msg := "PVC storing personal data must have data-retention-period label for GDPR compliance"
    }

    # HIPAA Compliance - Encryption required
    deny[msg] if {
        input.request.kind.kind == "Secret"
        contains_health_data
        not input.request.object.metadata.annotations["encryption.nova-forge.io/enabled"]
        msg := "Secret containing health data must be encrypted for HIPAA compliance"
    }

    has_audit_logging if {
        input.request.object.metadata.annotations["audit.nova-forge.io/enabled"] == "true"
    }

    stores_personal_data if {
        input.request.object.metadata.labels["data-type"] in ["personal", "pii", "customer"]
    }

    contains_health_data if {
        input.request.object.metadata.labels["data-type"] in ["health", "medical", "phi"]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-bundle-server-config
  namespace: nova-forge-governance
  labels:
    app: opa-server
    component: policy-engine
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

        access_log /var/log/nginx/access.log main;
        error_log /var/log/nginx/error.log;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/octet-stream;

        server {
            listen 8080;
            server_name localhost;

            location /bundles/ {
                root /usr/share/nginx/html;
                autoindex on;
                autoindex_exact_size off;
                autoindex_localtime on;

                add_header Cache-Control "no-cache, must-revalidate";
                add_header Content-Security-Policy "default-src 'self'";
                add_header X-Frame-Options "DENY";
                add_header X-Content-Type-Options "nosniff";

                location ~ \.tar\.gz$ {
                    add_header Content-Type application/gzip;
                }
            }

            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatekeeper-config
  namespace: nova-forge-governance
  labels:
    app: opa-gatekeeper
    component: policy-engine
data:
  config.yaml: |
    apiVersion: config.gatekeeper.sh/v1alpha1
    kind: Config
    metadata:
      name: config
      namespace: nova-forge-governance
    spec:
      match:
        - excludedNamespaces: ["kube-system", "gatekeeper-system", "nova-forge-governance"]
          processes: ["*"]
      validation:
        traces:
          - user:
              kind:
                group: "*"
                version: "*"
                kind: "*"
          - kind:
              group: "*"
              version: "*"
              kind: "*"
      readiness:
        statsEnabled: true
      sync:
        syncOnly:
          - group: ""
            version: "v1"
            kind: "Namespace"
          - group: ""
            version: "v1"
            kind: "Pod"
          - group: "apps"
            version: "v1"
            kind: "Deployment"
          - group: "apps"
            version: "v1"
            kind: "ReplicaSet"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: opa-server-hpa
  namespace: nova-forge-governance
  labels:
    app: opa-server
    component: policy-engine
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: opa-server-cluster
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
      selectPolicy: Min
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: opa-policy-engine-monitor
  namespace: nova-forge-governance
  labels:
    component: policy-engine
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      component: policy-engine
  endpoints:
  - port: http-api
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s