apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector-store-api
  labels:
    app: vector-store-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vector-store-api
  template:
    metadata:
      labels:
        app: vector-store-api
    spec:
      containers:
      - name: vector-store-api
        image: vector-store-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        - name: CONFIG_PATH
          value: "/app/config/vector_store/config.json"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
        - name: logs-volume
          mountPath: /app/logs
      volumes:
      - name: config-volume
        configMap:
          name: vector-store-config
      - name: logs-volume
        persistentVolumeClaim:
          claimName: vector-store-logs-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: vector-store-api
spec:
  selector:
    app: vector-store-api
  ports:
  - port: 80
    targetPort: 8000
  type: LoadBalancer

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-store-config
data:
  config.json: |
    {
      "dimension": 768,
      "metric": "cosine",
      "index_type": "IVF_FLAT",
      "stores": {
        "chromadb": {
          "host": "chromadb-service",
          "port": 8000
        },
        "elasticsearch": {
          "host": "elasticsearch-service",
          "port": 9200
        },
        "pinecone": {
          "host": "api.pinecone.io",
          "port": 443
        }
      }
    }

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vector-store-logs-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vector-store-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vector-store-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
