    resourceVersion: "16614"
    uid: 3dc8da30-6a13-4b13-b5b0-248e9758119f
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: code-server
        pod-template-hash: 78c68b5f6b
    template:
      metadata:
        annotations:
          iam.amazonaws.com/role: claude-cloudforge-bedrock-access
          kubectl.kubernetes.io/restartedAt: "2025-09-24T14:00:30+01:00"
        creationTimestamp: null
        labels:
          app: code-server
          pod-template-hash: 78c68b5f6b
      spec:
        containers:
        - env:
          - name: PASSWORD
          image: codercom/code-server:latest
          imagePullPolicy: Always
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          name: code-server
          ports:
          - containerPort: 8080
            protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 1
          resources:
            limits:
              cpu: "4"
              memory: 16Gi
            requests:
              cpu: 3500m
              memory: 14Gi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - mountPath: /home/coder
            name: workspace
          - mountPath: /home/coder/.config/code-server
            name: config
        - command:
          - sh
          - -c
          - echo Claude Code sidecar placeholder && sleep infinity
          env:
          - name: AWS_REGION
            value: us-west-2
          - name: BEDROCK_ENDPOINT
            value: https://bedrock-runtime.us-west-2.amazonaws.com
          - name: WORKSPACE_PATH
            value: /workspace
          image: busybox
          imagePullPolicy: Always
          name: claude-code
          resources:
            limits:
              cpu: "2"
              memory: 8Gi
            requests:
              cpu: 1500m
              memory: 7Gi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - mountPath: /workspace
            name: workspace
        - command:
          - sh
          - -c
          - |
            IDLE_TIMEOUT=14400  # 4 hours
            CHECK_INTERVAL=600   # 10 minutes
            IDLE_TIME=0

            check_activity() {
              # Check for recent file modifications
              if find /workspace -type f -mmin -10 2>/dev/null | grep -q .; then
                return 0
              fi
              # Check for active connections
              if netstat -tn 2>/dev/null | grep :8080 | grep -q ESTABLISHED; then
                return 0
              fi
              return 1
            }

            while true; do
              if check_activity; then
                echo "Activity detected, resetting timer"
                IDLE_TIME=0
              else
                IDLE_TIME=$((IDLE_TIME + CHECK_INTERVAL))
                echo "No activity for $IDLE_TIME seconds"

                if [ "$IDLE_TIME" -ge "$IDLE_TIMEOUT" ]; then
                  echo "Idle timeout reached, initiating shutdown..."
                  # Save any uncommitted changes
                  cd /workspace
                  for dir in $(find . -name ".git" -type d | sed 's/\/.git//'); do
                    cd "$dir"
                    if [ -n "$(git status --porcelain 2>/dev/null)" ]; then
                      git add -A
                      git commit -m "Auto-save before shutdown $(date)"
                      git push
                    fi
                    cd /workspace
                  done
                  # Terminate pod
                  kill 1
                fi
              fi
              sleep $CHECK_INTERVAL
            done
          image: alpine:latest
          imagePullPolicy: Always
          name: auto-shutdown
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - mountPath: /workspace
            name: workspace
        dnsPolicy: ClusterFirst
        initContainers:
        - command:
          - sh
          - -c
          - |
            if [ ! -d /workspace/.initialized ]; then
              echo "Setting up workspace..."
              mkdir -p /workspace/projects
              cd /workspace

              # Configure git
              git config --global user.name "mboecasse"
              git config --global user.email "mboecasse@gmail.com"
              git config --global credential.helper store

              # Clone the infrastructure repo
              git clone https://github.com/mboecasse/claude-cloudforge-infrastructure.git projects/infrastructure

              touch /workspace/.initialized
              echo "Workspace setup complete"
            fi
          env:
          - name: GITHUB_TOKEN
            valueFrom:
              secretKeyRef:
                key: token
                name: github-token
          image: alpine/git
          imagePullPolicy: Always
          name: workspace-setup
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - mountPath: /workspace
            name: workspace
        restartPolicy: Always
        schedulerName: default-scheduler
        securityContext: {}
        serviceAccount: bedrock-sa
        serviceAccountName: bedrock-sa
        terminationGracePeriodSeconds: 30
        volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: code-server-pvc
        - configMap:
            defaultMode: 420
            name: code-server-config
          name: config
