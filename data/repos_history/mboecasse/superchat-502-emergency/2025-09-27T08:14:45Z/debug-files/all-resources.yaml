dowMs\n});\napp.use(limiter);\n\napp.use(express.json());\n\n// Database connection\nconst pool = new Pool({\n  host: 'user-management-db.development.svc.cluster.local',\n  port: 5432,\n  database: 'user_management',\n  user: 'admin',\n  password: process.env.DB_PASSWORD\n});\n\n// Auth middleware\nconst authenticateToken = async (req, res, next) =\u003e {\n  const authHeader = req.headers['authorization'];\n  const token = authHeader \u0026\u0026 authHeader.split(' ')[1];\n\n  if (!token) {\n    // Try to get from cookie\n    const cookieHeader = req.headers.cookie;\n    if (cookieHeader) {\n      const cookies = cookieHeader.split(';').map(c =\u003e c.trim());\n      const authCookie = cookies.find(c =\u003e c.startsWith('_oauth2_proxy'));\n      if (authCookie) {\n        // User is authenticated via OAuth2 proxy\n        // For now, we'll assume they're a super admin if they got through OAuth\n        req.user = { role: 'super_admin' };\n        return next();\n      }\n    }\n    return res.status(401).json({ error: 'Access token required' });\n  }\n\n  try {\n    const decoded = jwt.verify(token, process.env.JWT_SECRET);\n    const user = await pool.query('SELECT * FROM users WHERE id = $1 AND status = $2', [decoded.userId, 'active']);\n\n    if (user.rows.length === 0) {\n      return res.status(403).json({ error: 'User not found or inactive' });\n    }\n\n    req.user = user.rows[0];\n    next();\n  } catch (error) {\n    return res.status(403).json({ error: 'Invalid token' });\n  }\n};\n\n// Check if user is super admin\nconst requireSuperAdmin = (req, res, next) =\u003e {\n  if (req.user.role !== 'super_admin') {\n    return res.status(403).json({ error: 'Super admin access required' });\n  }\n  next();\n};\n\n// Routes\n\n// Health check\napp.get('/api/user-management/health', (req, res) =\u003e {\n  res.json({ status: 'ok', timestamp: new Date().toISOString() });\n});\n\n// Get current user from OAuth headers\napp.get('/api/user-management/auth/me', asyn