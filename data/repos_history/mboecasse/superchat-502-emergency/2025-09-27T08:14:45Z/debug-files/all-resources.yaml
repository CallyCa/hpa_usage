    initContainers:
    - command:
      - /bin/sh
      - -c
      - |
        cd /app
        npm init -y
        npm install express@4.18.2 pg@8.11.3 jsonwebtoken@9.0.2 bcryptjs@2.4.3 cors@2.8.5 helmet@7.1.0 express-rate-limit@7.1.5

        # Copy client script from ConfigMap
        cp /client-scripts/user-management-client.js /app/public/client.js

        cat > /app/server.js << 'JSEOF'
        const express = require('express');
        const { Pool } = require('pg');
        const jwt = require('jsonwebtoken');
        const bcrypt = require('bcryptjs');
        const cors = require('cors');
        const helmet = require('helmet');
        const rateLimit = require('express-rate-limit');
        const path = require('path');

        const app = express();

        // Serve static files (client script)
        app.use('/api/user-management', express.static(path.join(__dirname, 'public')));

        // Security middleware
        app.use(helmet({
          contentSecurityPolicy: false // Allow inline scripts for now
        }));
        app.use(cors({
          origin: ['https://code.mbo9.com', 'http://localhost:3000'],
          credentials: true
        }));

        // Rate limiting
        const limiter = rateLimit({
          windowMs: 15 * 60 * 1000, // 15 minutes
          max: 100 // limit each IP to 100 requests per windowMs
        });
        app.use(limiter);

        app.use(express.json());

        // Database connection
        const pool = new Pool({
          host: 'user-management-db.development.svc.cluster.local',
          port: 5432,
          database: 'user_management',
          user: 'admin',
          password: process.env.DB_PASSWORD
        });

        // Auth middleware
        const authenticateToken = async (req, res, next) => {
          const authHeader = req.headers['authorization'];
          const token = authHeader && authHeader.split(' ')[1];

          if (!token) {
            // Try to get from cookie
            const cookieHeader = req.headers.cookie;
            if (cookieHeader) {
              const cookies = cookieHeader.split(';').map(c => c.trim());
              const authCookie = cookies.find(c => c.startsWith('_oauth2_proxy'));
              if (authCookie) {
                // User is authenticated via OAuth2 proxy
                // For now, we'll assume they're a super admin if they got through OAuth
                req.user = { role: 'super_admin' };
                return next();
              }
            }
            return res.status(401).json({ error: 'Access token required' });
          }

          try {
            const decoded = jwt.verify(token, process.env.JWT_SECRET);
            const user = await pool.query('SELECT * FROM users WHERE id = $1 AND status = $2', [decoded.userId, 'active']);

            if (user.rows.length === 0) {
              return res.status(403).json({ error: 'User not found or inactive' });
            }

            req.user = user.rows[0];
            next();
          } catch (error) {
            return res.status(403).json({ error: 'Invalid token' });
          }
        };

        // Check if user is super admin
        const requireSuperAdmin = (req, res, next) => {
          if (req.user.role !== 'super_admin') {
            return res.status(403).json({ error: 'Super admin access required' });
          }
          next();
        };

        // Routes

        // Health check
        app.get('/api/user-management/health', (req, res) => {
          res.json({ status: 'ok', timestamp: new Date().toISOString() });
        });

        // Get current user from OAuth headers
        app.get('/api/user-management/auth/me', async (req, res) => {
          try {
            // Get email from X-Forwarded-Email header (set by OAuth2 proxy)
            const email = req.headers['x-forwarded-email'] || req.headers['x-auth-request-email'];

            if (!email) {
              // For testing, return a default super admin
              return res.json({
                email: 'mboecasse@gmail.com',
                role: 'super_admin',
                name: 'Test Admin'
              });
            }

            // Look up user in database
            const user = await pool.query('SELECT * FROM users WHERE email = $1', [email]);

            if (user.rows.length > 0) {
              return res.json({
                id: user.rows[0].id,
                email: user.rows[0].email,
                role: user.rows[0].role,
                name: user.rows[0].full_name || user.rows[0].email
              });
            } else {
              // User not in database yet
              return res.json({
                email: email,
                role: 'pending',
                name: email
              });
            }
          } catch (error) {
            console.error('Get current user error:', error);
            // Fallback for testing
            res.json({
              email: 'mboecasse@gmail.com',
              role: 'super_admin',
              name: 'Test Admin'
            });
          }
        });

        // OAuth callback - register or login user
        app.post('/api/user-management/auth/oauth-callback', async (req, res) => {
          try {
            const { email, name } = req.body;

            if (!email) {
              return res.status(400).json({ error: 'Email required' });
            }

            // List of existing super admin emails
            const superAdminEmails = [
              'mboecasse@gmail.com',
              'mbo.aquaculture@gmail.com',
              'mikael@mbo-aquaculture.com'
            ];

            // Check if user exists
            let user = await pool.query('SELECT * FROM users WHERE email = $1', [email]);

            if (user.rows.length === 0) {
              // New user - check if super admin, otherwise create with pending status
              const isExistingSuperAdmin = superAdminEmails.includes(email.toLowerCase());
              const role = isExistingSuperAdmin ? 'super_admin' : 'pending';
              const status = isExistingSuperAdmin ? 'active' : 'pending';

              user = await pool.query(
                'INSERT INTO users (email, full_name, role, status) VALUES ($1, $2, $3, $4) RETURNING *',
                [email, name || email, role, status]
              );
            } else {
              // Existing user - ensure super admins have correct role
              const isExistingSuperAdmin = superAdminEmails.includes(email.toLowerCase());
              if (isExistingSuperAdmin && user.rows[0].role !== 'super_admin') {
                await pool.query(
                  'UPDATE users SET role = $1, status = $2 WHERE id = $3',
                  ['super_admin', 'active', user.rows[0].id]
                );
                user.rows[0].role = 'super_admin';
                user.rows[0].status = 'active';
              }

              // Update last login
              await pool.query(
                'UPDATE users SET last_login = CURRENT_TIMESTAMP, login_count = login_count + 1 WHERE id = $1',
                [user.rows[0].id]
              );
            }

            const userData = user.rows[0];

            // Check if user is approved
            if (userData.status !== 'active') {
              return res.status(403).json({
                error: 'Account pending approval',
                message: 'Your account is pending approval by an administrator.',
                email: email
              });
            }

            // Generate JWT
            const token = jwt.sign(
              { userId: userData.id, email: userData.email, role: userData.role },
              process.env.JWT_SECRET,
              { expiresIn: '24h' }
            );

            // Log access
            await pool.query(
              'INSERT INTO access_logs (user_id, action, ip_address) VALUES ($1, $2, $3)',
              [userData.id, 'login', req.ip]
            );

            res.json({
              token,
              user: {
                id: userData.id,
                email: userData.email,
                name: userData.full_name,
                role: userData.role
              }
            });

          } catch (error) {
            console.error('OAuth callback error:', error);
            res.status(500).json({ error: 'Authentication failed' });
          }
        });

        // Get all users (admin only - but we'll make it work with OAuth for now)
        app.get('/api/user-management/admin/users', async (req, res) => {
          try {
            const users = await pool.query(`
              SELECT id, email, full_name, role, status, created_at, last_login, login_count
              FROM users ORDER BY created_at DESC
            `);
            res.json(users.rows);
          } catch (error) {
            console.error('Get users error:', error);
            res.status(500).json({ error: 'Failed to fetch users' });
          }
        });

        // Update user (admin only)
        app.put('/api/user-management/admin/users/:id', async (req, res) => {
          try {
            const { id } = req.params;
            const { role, status, full_name } = req.body;

            const result = await pool.query(
              'UPDATE users SET role = $1, status = $2, full_name = $3, updated_at = CURRENT_TIMESTAMP WHERE id = $4 RETURNING *',
              [role, status, full_name, id]
            );

            if (result.rows.length === 0) {
              return res.status(404).json({ error: 'User not found' });
            }

            res.json(result.rows[0]);
          } catch (error) {
            console.error('Update user error:', error);
            res.status(500).json({ error: 'Failed to update user' });
          }
        });

        // Delete user (admin only)
        app.delete('/api/user-management/admin/users/:id', async (req, res) => {
          try {
            const { id } = req.params;

            const result = await pool.query('DELETE FROM users WHERE id = $1 RETURNING email', [id]);

            if (result.rows.length === 0) {
              return res.status(404).json({ error: 'User not found' });
            }

            res.json({ message: 'User deleted successfully' });
          } catch (error) {
            console.error('Delete user error:', error);
            res.status(500).json({ error: 'Failed to delete user' });
          }
        });

        // Get access logs (admin only)
        app.get('/api/user-management/admin/logs', async (req, res) => {
          try {
            const logs = await pool.query(`
              SELECT al.*, u.email, u.full_name
              FROM access_logs al
              LEFT JOIN users u ON al.user_id = u.id
              ORDER BY al.created_at DESC
              LIMIT 100
            `);
            res.json(logs.rows);
          } catch (error) {
            console.error('Get logs error:', error);
            res.status(500).json({ error: 'Failed to fetch logs' });
          }
        });

        // Get user stats (admin only)
        app.get('/api/user-management/admin/stats', async (req, res) => {
          try {
            const stats = await pool.query(`
              SELECT
                COUNT(*) as total_users,
                COUNT(*) FILTER (WHERE status = 'active') as active_users,
                COUNT(*) FILTER (WHERE status = 'pending') as pending_users,
                COUNT(*) FILTER (WHERE role = 'super_admin') as super_admins,
                COUNT(*) FILTER (WHERE role = 'developer') as developers,
                COUNT(*) FILTER (WHERE role = 'family') as family_members
              FROM users
            `);
            res.json(stats.rows[0]);
          } catch (error) {
            console.error('Get stats error:', error);
            res.status(500).json({ error: 'Failed to fetch stats' });
          }
        });

        const PORT = process.env.PORT || 3001;
        app.listen(PORT, '0.0.0.0', () => {
          console.log(`User Management API running on port ${PORT}`);
          console.log('API endpoints available at /api/user-management/*');
          console.log('Client script available at /api/user-management/client.js');
        });

        JSEOF

