            value: https://bedrock-runtime.us-west-2.amazonaws.com
          - name: WORKSPACE_PATH
            value: /workspace
          image: busybox
          imagePullPolicy: Always
          name: claude-code
          resources:
            limits:
              cpu: "2"
              memory: 8Gi
            requests:
              cpu: 1500m
              memory: 7Gi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - mountPath: /workspace
            name: workspace
        - args:
          - --repo=https://github.com/mboecasse/claude-cloudforge-infrastructure
          - --root=/workspace/repos
          - --period=5m
          - --link=current
          - --max-failures=10
          env:
          - name: GITSYNC_USERNAME
            value: mboecasse
          - name: GITSYNC_PASSWORD
            valueFrom:
              secretKeyRef:
                key: token
                name: github-token
          image: registry.k8s.io/git-sync/git-sync:v4.2.1
          imagePullPolicy: IfNotPresent
          name: git-sync
          resources:
            limits:
              cpu: 200m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - mountPath: /workspace
            name: workspace
        - command:
          - sh
          - -c
          - |
            IDLE_TIMEOUT=14400  # 4 hours
            CHECK_INTERVAL=600   # 10 minutes
            IDLE_TIME=0

            check_activity() {
              # Check for recent file modifications
              if find /workspace -type f -mmin -10 2>/dev/null | grep -q .; then
                return 0
              fi
              # Check for active connections
              if netstat -tn 2>/dev/null | grep :8080 | grep -q ESTABLISHED; then
                return 0
              fi
              return 1
            }

            while true; do
              if check_activity; then
                echo "Activity detected, resetting timer"
                IDLE_TIME=0
              else
                IDLE_TIME=$((IDLE_TIME + CHECK_INTERVAL))
                echo "No activity for $IDLE_TIME seconds"

                if [ "$IDLE_TIME" -ge "$IDLE_TIMEOUT" ]; then
                  echo "Idle timeout reached, initiating shutdown..."
                  # Save any uncommitted changes
                  cd /workspace
                  for dir in $(find . -name ".git" -type d | sed 's/\/.git//'); do
                    cd "$dir"
                    if [ -n "$(git status --porcelain 2>/dev/null)" ]; then
                      git add -A
                      git commit -m "Auto-save before shutdown $(date)"
                      git push
                    fi
                    cd /workspace
                  done
                  # Terminate pod
                  kill 1
                fi
              fi
              sleep $CHECK_INTERVAL
            done
          image: alpine:latest
          imagePullPolicy: Always
          name: auto-shutdown
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - mountPath: /workspace
            name: workspace
        dnsPolicy: ClusterFirst
        initContainers:
        - command:
          - sh
          - -c
          - |
            if [ ! -d /workspace/.initialized ]; then
              echo "Setting up workspace..."
              mkdir -p /workspace/projects
              cd /workspace

              # Configure git
              git config --global user.name "mboecasse"
              git config --global user.email "mboecasse@gmail.com"
              git config --global credential.helper store

              # Clone the infrastructure repo
              git clone https://github.com/mboecasse/claude-cloudforge-infrastructure.git projects/infrastructure

              touch /workspace/.initialized
              echo "Workspace setup complete"
            fi
          env:
          - name: GITHUB_TOKEN
            valueFrom:
              secretKeyRef:
                key: token
                name: github-token
          image: alpine/git
          imagePullPolicy: Always
          name: workspace-setup
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - mountPath: /workspace
            name: workspace
        restartPolicy: Always
        schedulerName: default-scheduler
        securityContext: {}
        serviceAccount: bedrock-sa
        serviceAccountName: bedrock-sa
        terminationGracePeriodSeconds: 30
        volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: code-server-pvc
        - configMap:
            defaultMode: 420
            name: code-server-config
          name: config
