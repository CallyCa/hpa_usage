  kind: Job
  metadata:
    annotations:
      kubectl.kubernetes.io/last-applied-configuration: |
        {"apiVersion":"batch/v1","kind":"Job","metadata":{"annotations":{},"name":"user-management-db-init","namespace":"development"},"spec":{"template":{"spec":{"containers":[{"command":["/bin/sh","-c","export PGPASSWORD=\"$POSTGRES_PASSWORD\"\n\n# Wait for database to be ready\nuntil pg_isready -h user-management-db -p 5432 -U admin; do\n  echo \"Waiting for database...\"\n  sleep 2\ndone\n\n# Create tables\npsql -h user-management-db -U admin -d user_management \u003c\u003c 'SQL'\n\n-- Users table\nCREATE TABLE IF NOT EXISTS users (\n  id SERIAL PRIMARY KEY,\n  email VARCHAR(255) UNIQUE NOT NULL,\n  full_name VARCHAR(255),\n  role VARCHAR(50) NOT NULL DEFAULT 'pending',\n  status VARCHAR(50) NOT NULL DEFAULT 'pending',\n  created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n  updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n  created_by_id INTEGER,\n  last_login TIMESTAMP,\n  login_count INTEGER DEFAULT 0\n);\n\n-- User roles and permissions\nCREATE TABLE IF NOT EXISTS roles (\n  id SERIAL PRIMARY KEY,\n  name VARCHAR(50) UNIQUE NOT NULL,\n  description TEXT,\n  permissions JSONB DEFAULT '{}',\n  created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP\n);\n\n-- Access logs\nCREATE TABLE IF NOT EXISTS access_logs (\n  id SERIAL PRIMARY KEY,\n  user_id INTEGER REFERENCES users(id),\n  action VARCHAR(100),\n  ip_address INET,\n  user_agent TEXT,\n  created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP\n);\n\n-- Sessions table for enhanced session management\nCREATE TABLE IF NOT EXISTS user_sessions (\n  id SERIAL PRIMARY KEY,\n  user_id INTEGER REFERENCES users(id),\n  session_token VARCHAR(255) UNIQUE,\n  expires_at TIMESTAMP,\n  created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n  last_activity TIMESTAMP DEFAULT CURRENT_TIMESTAMP\n);\n\n-- Insert default roles\nINSERT INTO roles (name, description, permissions) VALUES\n('super_admin', 'Super Administrator - Full system access', '{\"manage_users\": true, \"manage_system\": true, \"access_all\": true}'),\n('developer', 'Developer - Full development access', '{\"access_ide\": true, \"manage_projects\": true, \"view_logs\": true}'),\n('family', 'Family Member - Basic development access', '{\"access_ide\": true, \"manage_own_projects\": true}'),\n('pending', 'Pending Approval - No access', '{}')\nON CONFLICT (name) DO NOTHING;\n\n-- Insert initial super admins (all 3 existing admins)\nINSERT INTO users (email, full_name, role, status, created_at) VALUES\n('mboecasse@gmail.com', 'MBO (Super Admin)', 'super_admin', 'active', CURRENT_TIMESTAMP),\n('mbo.aquaculture@gmail.com', 'MBO Aquaculture (Super Admin)', 'super_admin', 'active', CURRENT_TIMESTAMP),\n('mikael@mbo-aquaculture.com', 'Mikael MBO Aquaculture (Super Admin)', 'super_admin', 'active', CURRENT_TIMESTAMP)\nON CONFLICT (email) DO UPDATE SET role = 'super_admin', status = 'active';\n\n-- Create indexes for performance\nCREATE INDEX IF NOT EXISTS idx_users_email ON users(email);\nCREATE INDEX IF NOT EXISTS idx_users_role ON users(role);\nCREATE INDEX IF NOT EXISTS idx_users_status ON users(status);\nCREATE INDEX IF NOT EXISTS idx_access_logs_user_id ON access_logs(user_id);\nCREATE INDEX IF NOT EXISTS idx_access_logs_created_at ON access_logs(created_at);\n\nGRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO admin;\nGRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO admin;\n\nSQL\n\necho \"Database initialized successfully!\"\n"],"env":[{"name":"POSTGRES_PASSWORD","valueFrom":{"secretKeyRef":{"key":"db-password","name":"user-management-secrets"}}}],"image":"postgres:15-alpine","name":"db-init"}],"restartPolicy":"OnFailure"}}}}
    creationTimestamp: "2025-09-26T20:18:56Z"
    generation: 1
    labels:
      batch.kubernetes.io/controller-uid: 7f46f534-15ec-47f0-b99b-657e01588c4c
      batch.kubernetes.io/job-name: user-management-db-init
