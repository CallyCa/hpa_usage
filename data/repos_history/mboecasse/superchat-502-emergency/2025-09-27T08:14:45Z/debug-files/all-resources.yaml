      image: busybox
      imagePullPolicy: Always
      name: claude-code
      resources:
        limits:
          cpu: "2"
          memory: 8Gi
        requests:
          cpu: 1500m
          memory: 7Gi
      terminationMessagePath: /dev/termination-log
      terminationMessagePolicy: File
      volumeMounts:
      - mountPath: /workspace
        name: workspace
      - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
        name: kube-api-access-d2hzh
        readOnly: true
      - mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
        name: aws-iam-token
        readOnly: true
    - command:
      - sh
      - -c
      - |
        IDLE_TIMEOUT=14400  # 4 hours
        CHECK_INTERVAL=600   # 10 minutes
        IDLE_TIME=0

        check_activity() {
          # Check for recent file modifications
          if find /workspace -type f -mmin -10 2>/dev/null | grep -q .; then
            return 0
          fi
          # Check for active connections
          if netstat -tn 2>/dev/null | grep :8080 | grep -q ESTABLISHED; then
            return 0
          fi
          return 1
        }

        while true; do
          if check_activity; then
            echo "Activity detected, resetting timer"
            IDLE_TIME=0
          else
            IDLE_TIME=$((IDLE_TIME + CHECK_INTERVAL))
            echo "No activity for $IDLE_TIME seconds"

            if [ "$IDLE_TIME" -ge "$IDLE_TIMEOUT" ]; then
              echo "Idle timeout reached, initiating shutdown..."
              # Save any uncommitted changes
              cd /workspace
              for dir in $(find . -name ".git" -type d | sed 's/\/.git//'); do
                cd "$dir"
                if [ -n "$(git status --porcelain 2>/dev/null)" ]; then
                  git add -A
                  git commit -m "Auto-save before shutdown $(date)"
                  git push
                fi
                cd /workspace
              done
              # Terminate pod
              kill 1
            fi
          fi
          sleep $CHECK_INTERVAL
        done
