apiVersion: v1
data:
  .dockerconfigjson: eyJhdXRocyI6eyJkb2NrZXIuY2lwaGVydHgubmV0Ijp7InVzZXJuYW1lIjoiZGthZG1pbiIsInBhc3N3b3JkIjoiU2VjdXJpdHlJc0Z1bmRhbWVudGFsMjAyMCMiLCJlbWFpbCI6ImNocmlzQGNpcGhlcnR4LmNvbSIsImF1dGgiOiJaR3RoWkcxcGJqcFRaV04xY21sMGVVbHpSblZ1WkdGdFpXNTBZV3d5TURJd0l3PT0ifX19
kind: Secret
metadata:
  name: regcred
type: kubernetes.io/dockerconfigjson
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idgs
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      name: idgs
  template:
    metadata:
      labels:
        name: idgs
    spec:
      containers:
        - name: idgs
          image: docker.ciphertx.net/idgs:idgs-v2.0.230
          resources:
            requests:
              cpu: 100m
          imagePullPolicy: Always
          ports:
            - name: liveness-port
              containerPort: 8443
              hostPort: 8443
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /actuator/health
              port: liveness-port
            initialDelaySeconds: 15
            periodSeconds: 8
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /actuator/health
              port: liveness-port
            initialDelaySeconds: 15
            periodSeconds: 9
          startupProbe:
            httpGet:
              scheme: HTTPS
              path: /actuator/health
              port: liveness-port

          env:
            - name: TZ
              value: "America/New_York"
            - name: DOCKER
              value: "true"
            - name: IDGS_HOME
              value: "/home/idgs"
            - name: IDGS_ENV
              value: "CTS_VNB_DEV_KUBE"
            - name: IDGS_KEYFILE
              value: "/home/idgs/idgs/ssl/dev.ciphertx.net.p12"
            - name: IDGS_KEYPASS
              value: "SecurityIsFundamental"
            - name: IDGS_MEM_OPT
              value: "-Xmx1024m"
      imagePullSecrets:
        - name: regcred
---
apiVersion: v1
kind: Service
metadata:
  name: idgs
spec:
  type: LoadBalancer
  ports:
    - name: tcp
      port: 8443
      targetPort: 8443
  selector:
    name: idgs
---
apiVersion: autoscaling/v2beta1
kind: HorizontalPodAutoscaler
metadata:
  name: idgs
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment

    name: idgs
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        targetAverageUtilization: 80
