apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: twitter-db-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: twitter-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: twitter-db
  template:
    metadata:
      labels:
        app: twitter-db
    spec:
      containers:
        - name: twitter-db
          image: twitter-db:1
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: passw
          ports:
            - containerPort: 3306
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: mysql-storage
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: twitter-db-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: twitter-db
spec:
  selector:
    app: twitter-db
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ums
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ums
  template:
    metadata:
      labels:
        app: ums
    spec:
      containers:
        - name: ums
          image: ums:1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: "twitter-db"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: "ums"
            - name: DB_USER
              value: "root"
            - name: DB_PASSWORD
              value: "passw"
---
apiVersion: v1
kind: Service
metadata:
  name: ums-service
spec:
  selector:
    app: ums
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8080
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: twitter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: twitter
  template:
    metadata:
      labels:
        app: twitter
    spec:
      containers:
        - name: twitter
          image: twitter:1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: "twitter-db"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: "twitter"
            - name: DB_USER
              value: "root"
            - name: DB_PASSWORD
              value: "passw"
            - name: UMS_HOST
              value: "ums"
            - name: UMS_PORT
              value: "8081"
---
apiVersion: v1
kind: Service
metadata:
  name: twitter-service
spec:
  selector:
    app: twitter
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8080
  type: NodePort
