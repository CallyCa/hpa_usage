apiVersion: apps/v1
kind: Deployment
metadata:
  name: ailyze-excel-celery-deployment
  labels:
    app:  ailyze-excel-celery
spec:
  replicas: 4
  selector:
    matchLabels:
      app: ailyze-excel-celery
  template:
    metadata:
      labels:
        app: ailyze-excel-celery
    spec:
      terminationGracePeriodSeconds: 60
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: excel-celery
                operator: In
                values:
                - "true"
      tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "excel-celery"
        effect: "NoSchedule"
      containers:
      - name: ailyze-excel
        image: ailyzeregistery.azurecr.io/ailyze-django:latest 
        imagePullPolicy: Always
        command: ["/bin/sh", "-c"]
        args:
          - >
            exec celery -A AILYZE worker -l info -Q celery -n ${POD_NAME}-celery -Ofair
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
          - secretRef:
              name: ailyze-django-secrets
        resources:
          requests:
            memory: "3Gi"
          limits:
            memory: "6Gi"
      imagePullSecrets:
      - name: acr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: ailyze-celery-excel-service
spec:
  selector:
    app: ailyze-excel-celery
  ports:
    - protocol: TCP
      port: 5555
      targetPort: 5555
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ailyze-excel-celery-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ailyze-excel-celery-deployment
  minReplicas: 4
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
    