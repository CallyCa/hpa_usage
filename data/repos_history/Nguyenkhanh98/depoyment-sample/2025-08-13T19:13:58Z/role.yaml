apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scale-role
  namespace: practicle-prod  # The namespace where the deployment resides
rules:
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scale-role-binding
  namespace: practicle-prod
subjects:
- kind: ServiceAccount
  name: default  # Replace with your CronJob's service account if different
  namespace: practicle-prod
roleRef:
  kind: Role
  name: scale-role  # The role created above
  apiGroup: rbac.authorization.k8s.io
