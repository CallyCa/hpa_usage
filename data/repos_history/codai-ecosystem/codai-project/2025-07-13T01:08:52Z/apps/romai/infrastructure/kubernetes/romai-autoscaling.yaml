# =============================================================================
# 📊 Custom Metrics - ServiceMonitor for Prometheus
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: romai-metrics
  namespace: romai-production
  labels:
    app: romai
    tier: monitoring
    component: metrics
spec:
  selector:
    matchLabels:
      metrics: enabled
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
    scheme: http
  - port: http
    interval: 30s
    path: /health
    scheme: http
---
# =============================================================================
# 🔍 Prometheus Rules for Custom Metrics
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: romai-autoscaling-rules
  namespace: romai-production
  labels:
    app: romai
    tier: monitoring
    component: rules
spec:
  groups:
  - name: romai.autoscaling
    interval: 30s
    rules:
    # HTTP requests per second
    - record: romai:http_requests_per_second
      expr: rate(http_requests_total{namespace="romai-production"}[5m])
    
    # Concurrent users
    - record: romai:concurrent_users
      expr: sum(websocket_connections{namespace="romai-production"}) by (pod)
    
    # MCP active connections
    - record: romai:mcp_active_connections
      expr: sum(mcp_connections_active{namespace="romai-production"}) by (pod)
    
    # API response time percentiles
    - record: romai:api_response_time_p95
      expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{namespace="romai-production"}[5m]))
    
    # Error rate
    - record: romai:error_rate
      expr: rate(http_requests_total{namespace="romai-production",status=~"5.."}[5m]) / rate(http_requests_total{namespace="romai-production"}[5m])
    
    # CPU saturation
    - record: romai:cpu_saturation
      expr: (1 - rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100
    
    # Memory utilization
    - record: romai:memory_utilization
      expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100
---
# =============================================================================
# 🚨 Alerting Rules for Auto-scaling Events
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: romai-autoscaling-alerts
  namespace: romai-production
  labels:
    app: romai
    tier: monitoring
    component: alerts
spec:
  groups:
  - name: romai.autoscaling.alerts
    rules:
    # High traffic alert
    - alert: RomaiHighTraffic
      expr: romai:http_requests_per_second > 500
      for: 2m
      labels:
        severity: warning
        component: autoscaler
      annotations:
        summary: "High traffic detected on ROMAI services"
        description: "Request rate is {{ $value }} requests/second, scaling may be needed"
    
    # Pod scaling limit reached
    - alert: RomaiPodScalingLimitReached
      expr: kube_horizontalpodautoscaler_status_current_replicas{namespace="romai-production"} >= kube_horizontalpodautoscaler_spec_max_replicas{namespace="romai-production"}
      for: 5m
      labels:
        severity: critical
        component: autoscaler
      annotations:
        summary: "ROMAI pod scaling limit reached"
        description: "{{ $labels.horizontalpodautoscaler }} has reached maximum replicas ({{ $value }})"
    
    # High error rate
    - alert: RomaiHighErrorRate
      expr: romai:error_rate > 0.05
      for: 3m
      labels:
        severity: critical
        component: api
      annotations:
        summary: "High error rate detected"
        description: "Error rate is {{ $value | humanizePercentage }}, immediate investigation required"
    
    # Resource exhaustion warning
    - alert: RomaiResourceExhaustion
      expr: romai:cpu_saturation > 85 or romai:memory_utilization > 90
      for: 5m
      labels:
        severity: warning
        component: infrastructure
      annotations:
        summary: "Resource exhaustion warning"
        description: "CPU: {{ $value }}% or Memory utilization is critically high"
