apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jelly-api
  namespace: jelly-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: jelly-api
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
