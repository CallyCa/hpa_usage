apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-user-fe-hpa
  namespace: develop-fe
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-user-fe-deployment
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70