apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: submission-service-hpa
  namespace: develop-be
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: submission-service-deployment
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
