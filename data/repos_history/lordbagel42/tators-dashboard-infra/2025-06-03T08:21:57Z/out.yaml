apiVersion: v1
kind: Namespace
metadata:
  name: tators-dashboard
---
apiVersion: v1
data:
  API_DOMAIN: my_api_domain
  API_KEY: my_api_key
  AUTO_SIGN_IN: ""
  BACKUP_INTERVAL: "3600000"
  DB_HOST: simple.default
  DB_NAME: tators_dashboard_kubes
  DB_OLD_HOST: my_db_old_host
  DB_OLD_NAME: my_db_old_name
  DB_OLD_PASS: my_db_old_pass
  DB_OLD_PORT: my_db_old_port
  DB_OLD_USER: my_db_old_user
  DB_PASS: securepassword
  DB_PORT: "5432"
  DB_USER: sylvie
  EVENT_SERVER_API_KEY: my_event_server_api_key
  HTTPS: "false"
  LOG: "true"
  LOG_FILE: ""
  MAX_BACKUPS: "3"
  OLD_SERVER_API_KEY: old_server_api_key
  OLD_SERVER_HOST: http://localhost:####
  PASSWORD_REQUEST_LIFETIME: "180000000"
  PORT: "8000"
  PUBLIC_APP_NAME: Tators Dashboard
  PUBLIC_DO_POTATO: "true"
  PUBLIC_DOMAIN: rpi1.local
  SECRET_OAUTH2_CLIENT_ID: google-client-id
  SECRET_OAUTH2_CLIENT_SECRET: google-client-secret
  SEND_STATUS_EMAILS: "false"
  SENDGRID_API_KEY: sendgrid-api-key
  SENDGRID_EMAIL: sendgrid-email
  SESSION_DURATION: "3600000"
  SUPPORT_EMAIL: someemail@email.com
  TBA_KEY: G7Nr9tjC6EiRnYg0PBhPf7UJqg0uS9phnxm56sysAG3q0cFuNeS99sj8Koklpokj
  WEBHOOK_AUTH_KEY: my_webhook_auth_key
kind: ConfigMap
metadata:
  name: env-6488tkm4f4
---
apiVersion: v1
kind: Service
metadata:
  name: tators-dashboard-lb
  namespace: tators-dashboard
spec:
  ports:
  - nodePort: 32122
    port: 443
    targetPort: dashboard
  selector:
    app: tators-dashboard-app
  type: LoadBalancer
status:
  loadBalancer:
    ingress:
    - ip: 192.168.0.55
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tators-dashboard-app
  namespace: tators-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tators-dashboard-app
  template:
    metadata:
      labels:
        app: tators-dashboard-app
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: env
        image: ghcr.io/lordbagel42/tators-dashboard:main
        imagePullPolicy: Always
        name: tators-dashboard-app
        namespace: tators-dashboard
        ports:
        - containerPort: 8000
          name: dashboard
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 1024Mi
          requests:
            cpu: 100m
            memory: 128Mi
      restartPolicy: Always
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tators-dashboard-hpa
  namespace: tators-dashboard
spec:
  maxReplicas: 3
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 50
        type: Utilization
    type: Resource
  minReplicas: 1
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tators-dashboard-app
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: env
  namespace: tators-dashboard
spec:
  encryptedData:
    API_DOMAIN: 
    API_KEY: 
    AUTO_SIGN_IN: 
    BACKUP_INTERVAL: 
    DB_HOST: 
    DB_NAME: 
    DB_OLD_HOST: 
    DB_OLD_NAME: 
    DB_OLD_PASS: 
    DB_OLD_PORT: 
    DB_OLD_USER: 
    DB_PASS: 
    DB_PORT: 
    DB_USER: 
    EVENT_SERVER_API_KEY: 
    HTTPS: 
    LOG: 
    LOG_FILE: 
    MAX_BACKUPS: 
    OLD_SERVER_API_KEY: 
    OLD_SERVER_HOST: 
    PASSWORD_REQUEST_LIFETIME: 
    PORT: 
    PUBLIC_APP_NAME: 
    PUBLIC_DO_POTATO: 
    PUBLIC_DOMAIN: 
    SECRET_OAUTH2_CLIENT_ID: 
    SECRET_OAUTH2_CLIENT_SECRET: 
    SEND_STATUS_EMAILS: 
    SENDGRID_API_KEY: 
    SENDGRID_EMAIL: 
    SESSION_DURATION: 
    SUPPORT_EMAIL: 
    TBA_KEY: 
    WEBHOOK_AUTH_KEY: 
  template:
    metadata:
      creationTimestamp: null
      name: env
      namespace: tators-dashboard
