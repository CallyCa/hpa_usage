apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler  
metadata:
  name: phishing-autoscaler  
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: phishing  
  minReplicas: 2  # Minimum number of replicas
  maxReplicas: 16 # Maximum number of replicas
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70 # Percentage of CPU usage for scaling



        