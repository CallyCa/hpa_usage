# The horizontal pod autoscaler automatically scales the number of pods based on observed CPU utilization or other selected metrics
# Create an HP
# Apply the HPA running: `kubectl apply -f hpa.yaml`

apiVersion: autoscaling/v2beta1
kind: HorizontalPodAutoscaler
metadata:
  name: go-kubernetes-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: go-kubernetes
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      targetAverageUtilization: 50