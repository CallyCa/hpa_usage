apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: testing-hpa
  namespace: test-auto-scalling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: test-server
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50