apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeschool-client
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: homeschool-client
  template:
    metadata:
      labels:
        app: homeschool-client
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - homeschool-client
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: homeschool-client
          image: 182821611732.dkr.ecr.us-east-1.amazonaws.com/homeschool:homeschool-client-VERSION_PLACEHOLDER
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
            limits:
              cpu: "300m" # 300m = 0.3 CPU cores
      nodeSelector:
        # arm64 deploys to the ARM nodes
        architecture: amd64

---
apiVersion: v1
kind: Service
metadata:
  name: homeschool-client-service
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external" # `internal` if you don't want it public
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing # `internal` if you don't want it public
    service.beta.kubernetes.io/aws-load-balancer-internal: "false"
spec:
  type: LoadBalancer
  selector:
    app: homeschool-client
  ports:
    - protocol: TCP
      port: 80 # Default port for the load balancer
      targetPort: 3000 # Default port for the container

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: homeschool-client-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: homeschool-client
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 150
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60 # 1 minute

# Creates a new application load balancer
# Creates the internet facing URL / DNS Name
# Creates a new network load balancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homeschool-client-ingress
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
    alb.ingress.kubernetes.io/actions.ssl-redirect: >
      {"Type": "redirect", "RedirectConfig": { "Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:182821611732:certificate/5bd7d043-2574-4ed0-8a65-f78faee964d0

spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ssl-redirect
                port:
                  name: use-annotation
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homeschool-client-service
                port:
                  number: 80
