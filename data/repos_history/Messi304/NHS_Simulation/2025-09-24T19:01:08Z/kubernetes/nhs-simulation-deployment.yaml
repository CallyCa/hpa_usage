apiVersion: v1
kind: Namespace
metadata:
  name: nhs-simulation
  labels:
    name: nhs-simulation
    thesis-objective: "cloud-native-deployment"
    compliance-scope: "uk-healthcare"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nhs-simulation-config
  namespace: nhs-simulation
  labels:
    app: nhs-simulation
    component: configuration
data:
  ENVIRONMENT: "kubernetes"
  LOG_LEVEL: "INFO"
  NHS_TRUST_CODE: "NHS-SIM"
  NHS_TRUST_NAME: "NHS Simulation Trust"
  DATA_CLASSIFICATION: "OFFICIAL-SENSITIVE"
  NUM_PATIENTS: "1000"
  INCLUDE_SENSITIVE_DATA: "true"
  INCLUDE_MENTAL_HEALTH: "true"
  INCLUDE_PEDIATRIC: "true"
  SECURITY_TEST_CATEGORIES: "patient_data_protection,access_control,compliance_automation,infrastructure_security"
  MAX_CONCURRENT_TESTS: "10"
  TEST_TIMEOUT_SECONDS: "30"
  COMPLIANCE_FRAMEWORKS: "UK-GDPR,NHS-IG,DCB0129,ISO27001,CYBER_ESSENTIALS"
  PORT: "8080"
  HOST: "0.0.0.0"
  API_PREFIX: "/api/v1"
  COLLECTION_INTERVAL: "30"
  ENABLE_METRICS_COLLECTION: "true"
  ENABLE_AUDIT_LOGGING: "true"
  THESIS_OBJECTIVES_MONITORING: "true"
  FHIR_COMPLIANCE_VALIDATION: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: nhs-simulation-secrets
  namespace: nhs-simulation
  labels:
    app: nhs-simulation
    component: secrets
type: Opaque
stringData:
  AZURE_CLIENT_ID: "managed-identity"
  AZURE_KEY_VAULT_URL: "https://nhssimkv.vault.azure.net/"
  DATABASE_CONNECTION_STRING: "encrypted-connection-string"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nhs-simulation
  namespace: nhs-simulation
  labels:
    app: nhs-simulation
    component: api
    thesis-objective: "infrastructure-scalability"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nhs-simulation
  template:
    metadata:
      labels:
        app: nhs-simulation
        component: api
        version: "3.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
        thesis.objectives/instrumented: "true"
        compliance.frameworks/monitored: "uk-gdpr,nhs-ig,dcb0129,iso27001,cyber-essentials"
    spec:
      serviceAccountName: nhs-simulation
      containers:
      - name: nhs-simulation-api
        image: nhs-simulation:3.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: SERVICE_ACCOUNT
          valueFrom:
            fieldRef:
              fieldPath: spec.serviceAccountName
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: nhs-simulation-config
        - secretRef:
            name: nhs-simulation-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /app/logs
      - name: azure-monitor-sidecar
        image: mcr.microsoft.com/azuremonitor/containerinsights/ciprod:3.1.4
        env:
        - name: AKS_RESOURCE_ID
          value: "/subscriptions/5adc5f0f-4a6c-43cd-8478-1223ee4f8d50/resourceGroups/rg-RLH-prod-uks/providers/Microsoft.ContainerService/managedClusters/rlh-prod-aks-nhs"
        - name: AKS_REGION
          value: "uksouth"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - effect: NoSchedule
        key: kubernetes.io/arch
        operator: Equal
        value: amd64
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nhs-simulation
  namespace: nhs-simulation
  labels:
    app: nhs-simulation
    component: service-account
  annotations:
    azure.workload.identity/client-id: "managed-identity-client-id"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: nhs-simulation
  name: nhs-simulation-role
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods", "nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nhs-simulation-rolebinding
  namespace: nhs-simulation
subjects:
- kind: ServiceAccount
  name: nhs-simulation
  namespace: nhs-simulation
roleRef:
  kind: Role
  name: nhs-simulation-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: nhs-simulation-service
  namespace: nhs-simulation
  labels:
    app: nhs-simulation
    component: service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
    service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: "/health"
spec:
  type: LoadBalancer
  selector:
    app: nhs-simulation
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 8080
    targetPort: 8080
    protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nhs-simulation-hpa
  namespace: nhs-simulation
  labels:
    app: nhs-simulation
    component: autoscaling
    thesis-objective: "infrastructure-scalability"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nhs-simulation
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nhs-simulation-pdb
  namespace: nhs-simulation
  labels:
    app: nhs-simulation
    component: availability
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: nhs-simulation
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nhs-simulation-netpol
  namespace: nhs-simulation
  labels:
    app: nhs-simulation
    component: security
    thesis-objective: "patient-data-security"
spec:
  podSelector:
    matchLabels:
      app: nhs-simulation
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    - namespaceSelector:
        matchLabels:
          name: kube-system
    - podSelector:
        matchLabels:
          app: nhs-simulation
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
  - to: []
    ports:
    - protocol: TCP
      port: 443