apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
   name: myproject-autoscaling
   namespace: myproject
spec:
   minReplicas: 1
   maxReplicas: 3
   metrics:
      - resource:
           name: cpu
           target:
              averageUtilization: 100
              type: Utilization
        type: Resource
   scaleTargetRef:
      apiVersion: apps/v1
      kind: Deployment
      name: myproject-deployment
