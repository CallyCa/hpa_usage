# Example Kubernetes Deployment for the SherlockAgent
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sherlock-agent-deployment
  labels:
    app: sherlock-agent
spec:
  replicas: 3 # Start with 3 replicas, can be autoscaled
  selector:
    matchLabels:
      app: sherlock-agent
  template:
    metadata:
      labels:
        app: sherlock-agent
    spec:
      containers:
      - name: sherlock-agent
        image: your-docker-registry/sherlock-agent:v1.0.0
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: platform-secrets
              key: rabbitmq-url
        - name: THEHIVE_API_KEY
          valueFrom:
            secretKeyRef:
              name: platform-secrets
              key: thehive-api-key
---
# Autoscaler to scale agents based on CPU usage or custom metrics (e.g., queue length)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sherlock-agent-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sherlock-agent-deployment
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
