---
# Defining Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: johnlewis
---
# Define Role
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: webservices-role
  namespace: comfort-apps
rules:
  - apiGroups:
      - ""
      - extensions
      - policy
      - apps
    resources:
      - services
      - replicasets
      - pods
      - ingresses
      - configmaps
      - endpoints
      - secrets
      - podsecuritypolicies
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
      - use
      - edit
    resourceNames:
      - restricted

---
# Defining Role binding
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: webservices-role-binding
  namespace: comfort-apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: webservices-role
subjects:
  # Authorize specific service accounts:
  - kind: ServiceAccount
    name: webservices
    namespace: comfort-apps
  - kind: ServiceAccount
    name: istio-citadel-service-account
    namespace: comfort-apps
  - kind: ServiceAccount
    name: istio-cleanup-secrets-service-account
    namespace: comfort-apps
  - kind: ServiceAccount
    name: istio-egressgateway-service-account
    namespace: comfort-apps
  - kind: ServiceAccount
    name: istio-galley-service-account
    namespace: comfort-apps
  - kind: ServiceAccount
    name: istio-ingressgateway-service-account
    namespace: comfort-apps
  - kind: ServiceAccount
    name: istio-mixer-service-account
    namespace: comfort-apps
  - kind: ServiceAccount
    name: istio-pilot-service-account
    namespace: comfort-apps
  - kind: ServiceAccount
    name: istio-security-post-install-account
    namespace: comfort-apps
  - kind: ServiceAccount
    name: istio-sidecar-injector-service-account
    namespace: comfort-apps

