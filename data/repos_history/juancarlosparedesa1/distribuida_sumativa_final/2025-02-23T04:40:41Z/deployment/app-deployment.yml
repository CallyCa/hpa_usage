apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-author
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-author
  template:
    metadata:
      labels:
        app: app-author
    spec:
      containers:
        - name: app-author
          image: jcparedesa1/app-authors
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              port: 8080
              path: /health/live
            initialDelaySeconds: 20
            periodSeconds: 5
          env:
            - name: JAVAX_SQL_DATASOURCE_MAIN_USERNAME
              value: "distribuida"
            - name: JAVAX_SQL_DATASOURCE_MAIN_PASSWORD
              value: "12345"
            - name: JAVAX_SQL_DATASOURCE_MAIN_URL
              value: "jdbc:postgresql://localhost:5432/distribuida"
            - name: SERVER_PORT
              value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: app-author-service
spec:
  type: LoadBalancer
  selector:
    app: app-author
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080


---

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-books
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-books
  template:
    metadata:
      labels:
        app: app-books
    spec:
      containers:
        - name: app-books
          image: jcparedesa1/app-books
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              port: 8080
              path: /health/live
            initialDelaySeconds: 20
            periodSeconds: 5
          env:
            - name: JAVAX_SQL_DATASOURCE_MAIN_USERNAME
              value: "postgres"
            - name: JAVAX_SQL_DATASOURCE_MAIN_PASSWORD
              value: "12345"
            - name: JAVAX_SQL_DATASOURCE_MAIN_URL
              value: "jdbc:postgresql://localhost:5432/distribuida"
            - name: SERVER_PORT
              value: "8080"
            - name: APP_AUTHORS_URL
              value: "http://localhost:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: app-books-service
spec:
  type: LoadBalancer
  selector:
    app: app-books
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-vue
  labels:
    app: app-vue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-vue
  template:
    metadata:
      name: app-vue
      labels:
        app: app-vue
    spec:
      containers:
        - name: app-vue
          image: docker.io/jcparedesa1/examenfrontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
          env:
            - name: VUE_APP_HOST
              value: app-books-services
            - name: VUE_APP_PORT
              value: "3001"
            - name: VUE_APP_PATH
              value: "books"
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: app-vue-service
spec:
  type: LoadBalancer
  selector:
    app: app-vue
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: app-vue-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: app-vue
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
