apiVersion: apps/v1
kind: Deployment
metadata:
  name: house-price-prediction
  labels:
    app: house-price-prediction
spec:
  replicas: 1
  selector:
    matchLabels:
      app: house-price-prediction
  template:
    metadata:
      labels:
        app: house-price-prediction
    spec:
      containers:
      - name: house-price-prediction
        image: ieeecontainerRegistry.azurecr.io/ieeecontainerRegistry/house-price-prediction-api
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            ram: "300Mi"
          limits:
            cpu: "500m"
            ram: "500Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: house-price-prediction
spec:
  selector:
    app: house-price-prediction
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: house-price-prediction-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: house-price-prediction
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 10
