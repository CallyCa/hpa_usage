apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: expcluster-pgpool
  namespace: experio
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: expcluster-pgpool
  minReplicas: 2
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 85
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Pods
        value: 1
        periodSeconds: 30
      selectPolicy: Max
