apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: firedelivery-app-hpa
  namespace: NAMESPACE
  labels:
    app: firedelivery
    component: hpa
    environment: ENVIRONMENT
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: firedelivery-app-COLOR
  minReplicas: 3
  maxReplicas: 10
  metrics:
    # CPU utilization
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    
    # Memory utilization
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    
    # Custom metrics (requests per second)
    - type: Pods
      pods:
        metric:
          name: requests_per_second
        target:
          type: AverageValue
          averageValue: "30"
    
    # External metrics (SQS queue length)
    - type: External
      external:
        metric:
          name: sqs_queue_length
          selector:
            matchLabels:
              queue: firedelivery-ENVIRONMENT
        target:
          type: AverageValue
          averageValue: "100"
  
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 minutes
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Min
    
    scaleUp:
      stabilizationWindowSeconds: 60   # 1 minute
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: firedelivery-worker-hpa
  namespace: NAMESPACE
  labels:
    app: firedelivery
    component: worker-hpa
    environment: ENVIRONMENT
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: firedelivery-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
    # CPU utilization
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    
    # Memory utilization
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    
    # Queue depth metric
    - type: External
      external:
        metric:
          name: redis_queue_length
          selector:
            matchLabels:
              queue: default
        target:
          type: AverageValue
          averageValue: "50"
  
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600  # 10 minutes (longer for workers)
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    
    scaleUp:
      stabilizationWindowSeconds: 120  # 2 minutes
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: firedelivery-websocket-hpa
  namespace: NAMESPACE
  labels:
    app: firedelivery
    component: websocket-hpa
    environment: ENVIRONMENT
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: firedelivery-websocket
  minReplicas: 2
  maxReplicas: 6
  metrics:
    # CPU utilization
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    
    # Memory utilization
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
    
    # WebSocket connections metric
    - type: Pods
      pods:
        metric:
          name: websocket_connections
        target:
          type: AverageValue
          averageValue: "1000"
  
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 180
    
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

---
# Vertical Pod Autoscaler for optimizing resource requests/limits
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: firedelivery-app-vpa
  namespace: NAMESPACE
  labels:
    app: firedelivery
    component: vpa
    environment: ENVIRONMENT
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: firedelivery-app-COLOR
  updatePolicy:
    updateMode: "Auto"  # Can be "Off", "Initial", or "Auto"
    minReplicas: 3
  resourcePolicy:
    containerPolicies:
      - containerName: firedelivery-app
        minAllowed:
          cpu: 200m
          memory: 256Mi
        maxAllowed:
          cpu: 2000m
          memory: 2Gi
        controlledResources: ["cpu", "memory"]
        controlledValues: RequestsAndLimits

---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: firedelivery-worker-vpa
  namespace: NAMESPACE
  labels:
    app: firedelivery
    component: worker-vpa
    environment: ENVIRONMENT
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: firedelivery-worker
  updatePolicy:
    updateMode: "Initial"  # Only set initial resources, don't auto-update
  resourcePolicy:
    containerPolicies:
      - containerName: queue-worker
        minAllowed:
          cpu: 100m
          memory: 128Mi
        maxAllowed:
          cpu: 1000m
          memory: 1Gi
        controlledResources: ["cpu", "memory"]

---
# Pod Disruption Budget to ensure availability during updates
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: firedelivery-app-pdb
  namespace: NAMESPACE
  labels:
    app: firedelivery
    component: pdb
    environment: ENVIRONMENT
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: firedelivery
      component: app

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: firedelivery-worker-pdb
  namespace: NAMESPACE
  labels:
    app: firedelivery
    component: worker-pdb
    environment: ENVIRONMENT
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: firedelivery
      component: worker

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: firedelivery-websocket-pdb
  namespace: NAMESPACE
  labels:
    app: firedelivery
    component: websocket-pdb
    environment: ENVIRONMENT
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: firedelivery
      component: websocket

---
# KEDA ScaledObject for advanced autoscaling based on Redis queue
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: firedelivery-worker-scaler
  namespace: NAMESPACE
  labels:
    app: firedelivery
    component: keda-scaler
    environment: ENVIRONMENT
spec:
  scaleTargetRef:
    name: firedelivery-worker
  minReplicaCount: 2
  maxReplicaCount: 20
  triggers:
    # Scale based on Redis queue length
    - type: redis
      metadata:
        address: firedelivery-redis-service:6379
        listName: queues:default
        listLength: '5'
        passwordFromEnv: REDIS_PASSWORD
    
    # Scale based on high priority queue
    - type: redis
      metadata:
        address: firedelivery-redis-service:6379
        listName: queues:high
        listLength: '2'
        passwordFromEnv: REDIS_PASSWORD
    
    # Scale based on CPU (fallback)
    - type: cpu
      metadata:
        type: Utilization
        value: '75'

---
# KEDA ScaledObject for WebSocket connections
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: firedelivery-websocket-scaler
  namespace: NAMESPACE
  labels:
    app: firedelivery
    component: websocket-keda-scaler
    environment: ENVIRONMENT
spec:
  scaleTargetRef:
    name: firedelivery-websocket
  minReplicaCount: 2
  maxReplicaCount: 10
  triggers:
    # Scale based on active WebSocket connections
    - type: prometheus
      metadata:
        serverAddress: http://prometheus:9090
        metricName: websocket_active_connections
        threshold: '1000'
        query: sum(websocket_active_connections{service="firedelivery-websocket"})
    
    # Scale based on memory usage
    - type: memory
      metadata:
        type: Utilization
        value: '70'