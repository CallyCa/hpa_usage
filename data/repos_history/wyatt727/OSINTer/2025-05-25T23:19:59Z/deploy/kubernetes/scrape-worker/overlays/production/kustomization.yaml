apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: osinter-scrape-worker-production

namespace: osinter-scrape-worker

resources:
- ../../

namePrefix: prod-

commonLabels:
  environment: production
  tier: production

commonAnnotations:
  deployment.kubernetes.io/revision: "1"
  config.kubernetes.io/origin: |
    configuredIn: deploy/kubernetes/scrape-worker/overlays/production/kustomization.yaml
    configuredBy:
      apiVersion: builtin
      kind: KustomizePlugin

images:
- name: osinter/scrape-worker
  newTag: v1.0.0-prod

replicas:
- name: scrape-worker
  count: 10

configMapGenerator:
- name: scrape-worker-production-config
  behavior: merge
  literals:
  - OSINTER_ENV=production
  - LOG_LEVEL=INFO
  - DEBUG=false
  - BROWSER_POOL_SIZE=10
  - WORKER_MAX_CONCURRENT_TASKS=8
  - PROXY_ENABLED=true
  - CAPTCHA_ENABLED=true
  - METRICS_ENABLED=true
  - TRACING_ENABLED=true
  - HEALTH_CHECK_ENABLED=true
  - KAFKA_CONSUMER_GROUP=osinter-scrape-workers-prod
  - KAFKA_SCRAPE_JOBS_TOPIC=osinter.prod.scraper.jobs
  - KAFKA_SCRAPE_RESULTS_TOPIC=osinter.prod.scraper.results
  - PROMETHEUS_NAMESPACE=osinter_prod
  - S3_ENABLED=true
  - S3_BUCKET=osinter-prod-artifacts

patchesStrategicMerge:
- deployment-patch.yaml
- service-patch.yaml
- hpa-patch.yaml

patchesJson6902:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: scrape-worker
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: "4Gi"
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: "2000m"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: "8Gi"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: "4000m"
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: JAVA_OPTS
        value: "-Xmx6g -Xms4g -XX:+UseG1GC"

- target:
    group: autoscaling
    version: v2
    kind: HorizontalPodAutoscaler
    name: scrape-worker-hpa
  patch: |-
    - op: replace
      path: /spec/minReplicas
      value: 5
    - op: replace
      path: /spec/maxReplicas
      value: 50
    - op: replace
      path: /spec/metrics/0/resource/target/averageUtilization
      value: 60
    - op: replace
      path: /spec/metrics/1/resource/target/averageUtilization
      value: 70

- target:
    group: policy
    version: v1
    kind: PodDisruptionBudget
    name: scrape-worker-pdb
  patch: |-
    - op: replace
      path: /spec/minAvailable
      value: 3 