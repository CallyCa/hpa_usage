apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: election-proxy-service-hpa
  namespace: electionvotingsystem
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: election-proxy-service
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: election-authface-service-hpa
  namespace: electionvotingsystem
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: election-authface-service
  minReplicas: 1
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
