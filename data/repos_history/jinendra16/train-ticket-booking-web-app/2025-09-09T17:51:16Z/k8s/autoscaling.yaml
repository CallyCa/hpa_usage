# Horizontal Pod Autoscaler for Backend
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: train-booking
  labels:
    app: train-ticket-booking
    component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
  # CPU utilization
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  # Memory utilization
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  # Custom metric: WebSocket connections per pod
  - type: Pods
    pods:
      metric:
        name: websocket_connections_per_pod
        selector:
          matchLabels:
            app: train-ticket-booking
            component: backend
      target:
        type: AverageValue
        averageValue: "50"  # Scale up when avg > 50 connections per pod
  # Custom metric: Redis memory usage
  - type: Object
    object:
      metric:
        name: redis_memory_usage_percentage
        selector:
          matchLabels:
            app: redis
      describedObject:
        apiVersion: v1
        kind: Service
        name: redis
      target:
        type: Value
        value: "75"  # Scale up when Redis memory > 75%
  # Custom metric: HTTP request rate per pod
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
        selector:
          matchLabels:
            app: train-ticket-booking
            component: backend
      target:
        type: AverageValue
        averageValue: "100"  # Scale up when avg > 100 req/s per pod
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 minutes
      policies:
      - type: Percent
        value: 10  # Scale down by max 10% of current replicas
        periodSeconds: 60
      - type: Pods
        value: 2  # Scale down by max 2 pods
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60  # 1 minute
      policies:
      - type: Percent
        value: 50  # Scale up by max 50% of current replicas
        periodSeconds: 60
      - type: Pods
        value: 4  # Scale up by max 4 pods
        periodSeconds: 60
      selectPolicy: Max
---
# Horizontal Pod Autoscaler for Frontend
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
  namespace: train-booking
  labels:
    app: train-ticket-booking
    component: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  # CPU utilization
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  # Memory utilization
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 20
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      selectPolicy: Max
---
# Vertical Pod Autoscaler for Backend
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: backend-vpa
  namespace: train-booking
  labels:
    app: train-ticket-booking
    component: backend
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  updatePolicy:
    updateMode: "Auto"  # Auto, Initial, Off
  resourcePolicy:
    containerPolicies:
    - containerName: backend
      minAllowed:
        cpu: 100m
        memory: 256Mi
      maxAllowed:
        cpu: 2000m
        memory: 4Gi
      controlledResources: ["cpu", "memory"]
      controlledValues: RequestsAndLimits
---
# Vertical Pod Autoscaler for Frontend
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: frontend-vpa
  namespace: train-booking
  labels:
    app: train-ticket-booking
    component: frontend
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
    - containerName: frontend
      minAllowed:
        cpu: 100m
        memory: 128Mi
      maxAllowed:
        cpu: 1000m
        memory: 1Gi
      controlledResources: ["cpu", "memory"]
      controlledValues: RequestsAndLimits
---
# Pod Disruption Budget for Backend
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: train-booking
  labels:
    app: train-ticket-booking
    component: backend
spec:
  minAvailable: 2  # Always keep at least 2 backend pods running
  selector:
    matchLabels:
      app: train-ticket-booking
      component: backend
---
# Pod Disruption Budget for Frontend
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  namespace: train-booking
  labels:
    app: train-ticket-booking
    component: frontend
spec:
  minAvailable: 1  # Always keep at least 1 frontend pod running
  selector:
    matchLabels:
      app: train-ticket-booking
      component: frontend
---
# Custom Resource for WebSocket Connection Metrics
apiVersion: v1
kind: Service
metadata:
  name: custom-metrics-api
  namespace: train-booking
  labels:
    app: custom-metrics-api
spec:
  ports:
  - port: 443
    targetPort: 8443
  selector:
    app: custom-metrics-api
---
# ServiceMonitor for custom metrics (Prometheus)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: websocket-metrics
  namespace: train-booking
  labels:
    app: train-ticket-booking
spec:
  selector:
    matchLabels:
      app: train-ticket-booking
      component: backend
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
    scrapeTimeout: 10s
---
# PrometheusRule for custom alerts
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: train-booking-alerts
  namespace: train-booking
  labels:
    app: train-ticket-booking
spec:
  groups:
  - name: train-booking.rules
    rules:
    # High WebSocket connections alert
    - alert: HighWebSocketConnections
      expr: websocket_connections_total > 1000
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "High number of WebSocket connections"
        description: "WebSocket connections are above 1000 for more than 2 minutes"
    
    # High Redis memory usage alert
    - alert: HighRedisMemoryUsage
      expr: redis_memory_usage_percentage > 85
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Redis memory usage is high"
        description: "Redis memory usage is above 85% for more than 5 minutes"
    
    # Backend pod crash loop
    - alert: BackendPodCrashLoop
      expr: rate(kube_pod_container_status_restarts_total{namespace="train-booking",pod=~"backend-.*"}[15m]) > 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Backend pod is crash looping"
        description: "Backend pod {{ $labels.pod }} is restarting frequently"
    
    # High response time
    - alert: HighResponseTime
      expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{namespace="train-booking"}[5m])) > 2
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "High response time detected"
        description: "95th percentile response time is above 2 seconds for more than 10 minutes"