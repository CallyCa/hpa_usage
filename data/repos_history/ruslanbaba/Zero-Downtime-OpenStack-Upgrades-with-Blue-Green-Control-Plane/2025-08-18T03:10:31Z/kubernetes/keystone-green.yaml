apiVersion: apps/v1
kind: Deployment
metadata:
  name: keystone-api
  namespace: openstack-green
  labels:
    app: keystone
    component: api
    environment: green
spec:
  replicas: 3
  selector:
    matchLabels:
      app: keystone
      component: api
      environment: green
  template:
    metadata:
      labels:
        app: keystone
        component: api
        environment: green
        tier: control
    spec:
      containers:
      - name: keystone-api
        image: docker.io/kolla/ubuntu-source-keystone:zed  # Updated version
        ports:
        - containerPort: 5000
          name: public
        - containerPort: 35357
          name: admin
        env:
        - name: KOLLA_CONFIG_STRATEGY
          value: COPY_ALWAYS
        - name: KOLLA_SERVICE_NAME
          value: keystone
        - name: UPGRADE_MARKER
          value: "green-environment"
        volumeMounts:
        - name: keystone-config
          mountPath: /var/lib/kolla/config_files
        - name: keystone-fernet-keys
          mountPath: /etc/keystone/fernet-keys
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /v3
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /v3
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 5
      volumes:
      - name: keystone-config
        configMap:
          name: keystone-config
      - name: keystone-fernet-keys
        secret:
          secretName: keystone-fernet-keys
---
apiVersion: v1
kind: Service
metadata:
  name: keystone-api
  namespace: openstack-green
  labels:
    app: keystone
    component: api
    environment: green
spec:
  selector:
    app: keystone
    component: api
    environment: green
  ports:
  - name: public
    port: 5000
    targetPort: 5000
  - name: admin
    port: 35357
    targetPort: 35357
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: keystone-api-hpa
  namespace: openstack-green
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: keystone-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
