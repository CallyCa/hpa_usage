apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hmssql-neo-hpa
  labels:
    app: hmssql-neo
    tier: database
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hmssql-neo-enterprise
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    - type: Pods
      pods:
        metric:
          name: database_connections_per_second
        target:
          type: AverageValue
          averageValue: "100"
    - type: Pods
      pods:
        metric:
          name: database_queries_per_second
        target:
          type: AverageValue
          averageValue: "1000"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 30
        - type: Pods
          value: 5
          periodSeconds: 30
      selectPolicy: Max

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hmssql-neo-pdb
  labels:
    app: hmssql-neo
    tier: database
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: hmssql-neo
      tier: database

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hmssql-neo-network-policy
  labels:
    app: hmssql-neo
    tier: database
spec:
  podSelector:
    matchLabels:
      app: hmssql-neo
      tier: database
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: application-tier
        - podSelector:
            matchLabels:
              tier: application
      ports:
        - protocol: TCP
          port: 3306
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: hmssql-neo
      ports:
        - protocol: TCP
          port: 3306
        - protocol: TCP
          port: 8080
    - to: []
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
