apiVersion: apps/v1
kind: Deployment
metadata:
  name: connector-service
  namespace: eios-services
  labels:
    app: connector-service
    phase: "3"
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: connector-service
  template:
    metadata:
      labels:
        app: connector-service
        version: v1
    spec:
      serviceAccountName: eios-service-account
      containers:
      - name: connector-service
        image: your-registry.com/connector-service:v1.0.0
        ports:
        - containerPort: 8100
          name: http
        - containerPort: 9090
          name: metrics
        env:
        - name: PORT
          value: "8100"
        - name: GIN_MODE
          value: "release"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-connector-secret
              key: database-url
        - name: REDIS_URL
          value: "redis-service:6379"
        - name: CACHE_TTL
          value: "5m"
        - name: ENABLE_CUSTOM_CONNECTORS
          value: "true"
        - name: ENABLE_MARKETPLACE
          value: "true"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8100
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8100
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: connector-config
          mountPath: /etc/connector
          readOnly: true
      volumes:
      - name: connector-config
        configMap:
          name: connector-config
---
apiVersion: v1
kind: Service
metadata:
  name: connector-service
  namespace: eios-services
  labels:
    app: connector-service
spec:
  type: ClusterIP
  ports:
  - port: 8100
    targetPort: 8100
    protocol: TCP
    name: http
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: metrics
  selector:
    app: connector-service
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: connector-config
  namespace: eios-services
data:
  connectors.yaml: |
    marketplace:
      featured:
        - salesforce
        - stripe
        - google-sheets
        - slack
      categories:
        - crm
        - payment
        - productivity
        - communication
        - database
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: connector-service-hpa
  namespace: eios-services
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: connector-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70