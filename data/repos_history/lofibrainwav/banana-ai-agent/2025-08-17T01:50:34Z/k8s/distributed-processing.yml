# 🔄 Distributed Processing with Redis Streams + Celery + Ray
# Enterprise-grade distributed computing for SuperClaude Squad

---
# 📡 Redis Streams Configuration for Real-time Messaging
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-streams-config
  namespace: production
data:
  redis.conf: |
    # Redis Streams optimized configuration
    maxmemory 4gb
    maxmemory-policy allkeys-lru
    
    # Stream-specific settings
    stream-node-max-bytes 10mb
    stream-node-max-entries 1000
    
    # High performance settings
    tcp-keepalive 300
    timeout 0
    tcp-backlog 511
    
    # Persistence for reliability
    appendonly yes
    appendfsync everysec
    no-appendfsync-on-rewrite no
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb
    
    # Memory optimization
    hash-max-ziplist-entries 512
    hash-max-ziplist-value 64
    list-max-ziplist-size -2
    set-max-intset-entries 512
    zset-max-ziplist-entries 128
    zset-max-ziplist-value 64

---
# 🔄 Redis Streams Cluster Deployment
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-streams-cluster
  namespace: production
  labels:
    app: redis-streams
    component: message-queue
spec:
  serviceName: redis-streams-headless
  replicas: 3
  selector:
    matchLabels:
      app: redis-streams
  template:
    metadata:
      labels:
        app: redis-streams
        component: message-queue
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        command:
        - redis-server
        - /etc/redis/redis.conf
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "1"
        volumeMounts:
        - name: redis-config
          mountPath: /etc/redis
        - name: redis-data
          mountPath: /data
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          timeoutSeconds: 1
          periodSeconds: 5
      volumes:
      - name: redis-config
        configMap:
          name: redis-streams-config
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: gp3
      resources:
        requests:
          storage: 100Gi

---
# 🌐 Redis Streams Service
apiVersion: v1
kind: Service
metadata:
  name: redis-streams-headless
  namespace: production
spec:
  clusterIP: None
  selector:
    app: redis-streams
  ports:
  - port: 6379
    targetPort: 6379
    name: redis

---
apiVersion: v1
kind: Service
metadata:
  name: redis-streams-service
  namespace: production
spec:
  selector:
    app: redis-streams
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
  type: ClusterIP

---
# 🔧 Celery Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: celery-config
  namespace: production
data:
  celeryconfig.py: |
    # Celery configuration for SuperClaude Squad
    
    # Broker settings (Redis Streams)
    broker_url = 'redis://redis-streams-service:6379/0'
    result_backend = 'redis://redis-streams-service:6379/1'
    
    # Task routing for SuperClaude Squad
    task_routes = {
        'superclaude.core.*': {'queue': 'core_processing'},
        'superclaude.music.*': {'queue': 'music_processing'},
        'superclaude.coordination.*': {'queue': 'coordination'},
        'superclaude.batch.*': {'queue': 'batch_processing'},
    }
    
    # Worker settings
    worker_prefetch_multiplier = 1
    worker_max_tasks_per_child = 1000
    worker_disable_rate_limits = True
    
    # Task settings
    task_serializer = 'json'
    result_serializer = 'json'
    accept_content = ['json']
    timezone = 'UTC'
    enable_utc = True
    
    # Performance optimizations
    broker_connection_retry_on_startup = True
    broker_connection_retry = True
    broker_connection_max_retries = 10
    
    # Result backend settings
    result_expires = 3600  # 1 hour
    result_compression = 'gzip'
    
    # Task execution settings
    task_time_limit = 300  # 5 minutes hard limit
    task_soft_time_limit = 240  # 4 minutes soft limit
    task_acks_late = True
    worker_send_task_events = True
    task_send_sent_event = True
    
    # Beat schedule for periodic tasks
    beat_schedule = {
        'health-check': {
            'task': 'superclaude.core.health_check',
            'schedule': 30.0,  # Every 30 seconds
        },
        'cleanup-expired': {
            'task': 'superclaude.core.cleanup_expired',
            'schedule': 300.0,  # Every 5 minutes
        },
        'metrics-collection': {
            'task': 'superclaude.monitoring.collect_metrics',
            'schedule': 60.0,  # Every minute
        },
    }

---
# 🚀 Celery Workers Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-core-workers
  namespace: production
  labels:
    app: celery-workers
    component: core-processing
spec:
  replicas: 15  # High concurrency for core processing
  selector:
    matchLabels:
      app: celery-workers
      component: core-processing
  template:
    metadata:
      labels:
        app: celery-workers
        component: core-processing
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
      - name: celery-worker
        image: banana-ai-celery:latest
        command:
        - celery
        - -A
        - banana_ai.celery_app
        - worker
        - --loglevel=info
        - --concurrency=4
        - --queues=core_processing
        - --hostname=core-worker@%h
        - --prefetch-multiplier=1
        env:
        - name: CELERY_CONFIG_MODULE
          value: "celeryconfig"
        - name: WORKER_TYPE
          value: "core"
        - name: REDIS_URL
          value: "redis://redis-streams-service:6379"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1"
        volumeMounts:
        - name: celery-config
          mountPath: /app/celeryconfig.py
          subPath: celeryconfig.py
        livenessProbe:
          exec:
            command:
            - celery
            - -A
            - banana_ai.celery_app
            - inspect
            - ping
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
      volumes:
      - name: celery-config
        configMap:
          name: celery-config

---
# 🎵 Celery Music Workers (GPU-enabled)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-music-workers
  namespace: production
  labels:
    app: celery-workers
    component: music-processing
spec:
  replicas: 8  # GPU-constrained
  selector:
    matchLabels:
      app: celery-workers
      component: music-processing
  template:
    metadata:
      labels:
        app: celery-workers
        component: music-processing
    spec:
      containers:
      - name: celery-worker
        image: banana-ai-celery-gpu:latest
        command:
        - celery
        - -A
        - banana_ai.celery_app
        - worker
        - --loglevel=info
        - --concurrency=2  # Lower concurrency for GPU workloads
        - --queues=music_processing
        - --hostname=music-worker@%h
        env:
        - name: TORCH_DEVICE
          value: "cuda"
        - name: WORKER_TYPE
          value: "music"
        - name: REDIS_URL
          value: "redis://redis-streams-service:6379"
        resources:
          requests:
            memory: "4Gi"
            cpu: "1"
            nvidia.com/gpu: 1
          limits:
            memory: "8Gi"
            cpu: "2"
            nvidia.com/gpu: 1
        volumeMounts:
        - name: celery-config
          mountPath: /app/celeryconfig.py
          subPath: celeryconfig.py
        - name: model-cache
          mountPath: /models
      volumes:
      - name: celery-config
        configMap:
          name: celery-config
      - name: model-cache
        persistentVolumeClaim:
          claimName: music-models-pvc
      nodeSelector:
        accelerator: nvidia-tesla-v100

---
# 🧠 Celery Coordination Workers
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-coordination-workers
  namespace: production
  labels:
    app: celery-workers
    component: coordination
spec:
  replicas: 10
  selector:
    matchLabels:
      app: celery-workers
      component: coordination
  template:
    metadata:
      labels:
        app: celery-workers
        component: coordination
    spec:
      containers:
      - name: celery-worker
        image: banana-ai-celery:latest
        command:
        - celery
        - -A
        - banana_ai.celery_app
        - worker
        - --loglevel=info
        - --concurrency=6
        - --queues=coordination
        - --hostname=coord-worker@%h
        env:
        - name: WORKER_TYPE
          value: "coordination"
        - name: REDIS_URL
          value: "redis://redis-streams-service:6379"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: celery-config
          mountPath: /app/celeryconfig.py
          subPath: celeryconfig.py
      volumes:
      - name: celery-config
        configMap:
          name: celery-config

---
# 📊 Celery Beat Scheduler
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: production
  labels:
    app: celery-beat
    component: scheduler
spec:
  replicas: 1  # Single scheduler instance
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
        component: scheduler
    spec:
      containers:
      - name: celery-beat
        image: banana-ai-celery:latest
        command:
        - celery
        - -A
        - banana_ai.celery_app
        - beat
        - --loglevel=info
        - --schedule=/app/celerybeat-schedule
        env:
        - name: REDIS_URL
          value: "redis://redis-streams-service:6379"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        volumeMounts:
        - name: celery-config
          mountPath: /app/celeryconfig.py
          subPath: celeryconfig.py
        - name: beat-schedule
          mountPath: /app
      volumes:
      - name: celery-config
        configMap:
          name: celery-config
      - name: beat-schedule
        emptyDir: {}

---
# 📈 Flower Monitoring
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-flower
  namespace: production
  labels:
    app: celery-flower
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-flower
  template:
    metadata:
      labels:
        app: celery-flower
        component: monitoring
    spec:
      containers:
      - name: flower
        image: mher/flower:latest
        command:
        - celery
        - -A
        - banana_ai.celery_app
        - flower
        - --broker=redis://redis-streams-service:6379/0
        - --port=5555
        ports:
        - containerPort: 5555
          name: flower
        env:
        - name: FLOWER_BASIC_AUTH
          value: "admin:superclaude123"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: celery-flower-service
  namespace: production
spec:
  selector:
    app: celery-flower
  ports:
  - port: 5555
    targetPort: 5555
    name: flower
  type: ClusterIP

---
# 🔄 HPA for Celery Workers
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: celery-core-workers-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: celery-core-workers
  minReplicas: 15
  maxReplicas: 100
  metrics:
  - type: External
    external:
      metric:
        name: redis_queue_length
        selector:
          matchLabels:
            queue: core_processing
      target:
        type: AverageValue
        averageValue: "50"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 25
        periodSeconds: 60

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: celery-music-workers-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: celery-music-workers
  minReplicas: 8
  maxReplicas: 25  # GPU constrained
  metrics:
  - type: External
    external:
      metric:
        name: redis_queue_length
        selector:
          matchLabels:
            queue: music_processing
      target:
        type: AverageValue
        averageValue: "20"  # Lower threshold for GPU workloads
  - type: Resource
    resource:
      name: nvidia.com/gpu
      target:
        type: Utilization
        averageUtilization: 80