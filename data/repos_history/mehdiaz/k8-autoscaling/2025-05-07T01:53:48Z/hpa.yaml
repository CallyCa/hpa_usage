apiVersion: autoscaling/v2 # Utilisez v2 pour plus de fonctionnalités
kind: HorizontalPodAutoscaler
metadata:
  name: php-apache-hpa # Nom du HPA
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: php-apache # Cible notre déploiement
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        # Utilisation CPU cible en pourcentage de la ressource demandée (requests.cpu)
        averageUtilization: 50