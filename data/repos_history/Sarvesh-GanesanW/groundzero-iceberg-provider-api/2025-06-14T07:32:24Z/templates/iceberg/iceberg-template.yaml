apiVersion: batch/v1
kind: Job
metadata:
  labels:
    name: spark-master
    sessionIdentifier: ""
  name: spark-master
  namespace: spark
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        name: spark-master
        sessionIdentifier: ""
    spec:
      serviceAccountName: my-service-account
      restartPolicy: Never
      containers:
      - name : spark-master
        image: ""
        imagePullPolicy: "Always"
        env:
        - name: S3URI
          value: "Default"
        - name: SPARKSVC
          value: "spark://spark-conn:7077"
        - name: nmspc
          value: "spark"
        - name: replCount
          value: '0'
        - name: REGION
          value: ""
        - name: DB_SECRET_NAME
          value: ""
        - name: auditdb
          value: "auditdb"
        - name: catalog
          value: 'catalog'
        - name: siteDB
          value: ''
        - name: HADOOP_USER_NAME
          value: ''
        - name: switch
          value: ''
        - name: switchAttributes
          value: ''
        ports:
        - containerPort: 7077
          protocol: TCP
        - containerPort: 8888
          protocol: TCP
        - containerPort: 50051
          protocol: TCP
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "2Gi"
            cpu: "1"
        command:
         - "/bin/sh"
         - "-c"
         - "--"
        args :
         - './start-master.sh'
---
apiVersion: v1
kind: Service
metadata:
  name: spark-conn
  namespace: spark
  labels:
    name: spark-conn
    sessionIdentifier: ""
spec:
  ports:
    # the port that this service should serve on
  - name: webui
    port: 8080
    targetPort: 8080
  - name: spark
    port: 7077
    targetPort: 7077
  - name: rest
    port: 6066
    targetPort: 6066
  - name: grpc
    port: 50051
    targetPort: 50051
  selector:
    name: spark-master
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: spark-worker
  namespace: spark
  labels:
    name: spark-worker-hpa
    sessionIdentifier: ""
spec:
  maxReplicas: 4
  minReplicas: 1
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: spark-worker-as
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 60
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    name: spark-worker-as
    sessionIdentifier: ""
  name: spark-worker-as
  namespace: spark
spec:
  selector:
    matchLabels:
      name: spark-worker-as
  replicas: 1
  template:
    metadata:
      labels:
        name: spark-worker-as
        sessionIdentifier: ""
    spec:
      serviceAccountName: my-service-account
      containers:
      - name : spark-worker-as
        image: ""
        imagePullPolicy: "Always"
        env:
        - name: S3URI
          value: "Default"
        - name: SPARKSVC
          value: "spark://spark-conn:7077"
        - name: nmspc
          value: "spark"
        - name: REGION
          value: ""
        - name: DB_SECRET_NAME
          value: ""
        - name: catalog
          value: 'catalog'
        - name: siteDB
          value: ''
        - name: HADOOP_USER_NAME
          value: ''
        - name: switch
          value: ''
        - name: switchAttributes
          value: ''
        ports:
        - containerPort: 7077
          protocol: TCP
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "2Gi"
            cpu: "1"
        command:
         - "/bin/sh"
         - "-c"
         - "--"
        args :
         - './start-worker.sh ; sleep infinity'
---
apiVersion: v1
kind: Service
metadata:
  labels:
    sessionIdentifier: ""
  name: iceapi-service
  namespace: default
spec:
  ports:
  - port: 8888
    protocol: TCP
    targetPort: 8888
  selector:
    name: spark-master
  type: NodePort