apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{APP_NAME}}-keda
  namespace: {{NAMESPACE}}
  labels:
    app: {{APP_NAME}}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{APP_NAME}}

  minReplicaCount: {{MIN_REPLICAS}}
  maxReplicaCount: {{MAX_REPLICAS}}

  pollingInterval: 5
  cooldownPeriod: 60

  triggers:
  # Trigger 1: Prometheus - HTTP Requests per Second
  - type: prometheus
    metadata:
      serverAddress: http://prometheus-server.monitoring.svc.cluster.local:9090
      metricName: http_requests_per_second
      query: |
        sum(rate(http_requests_total{app="{{APP_NAME}}"}[1m]))
      threshold: "10000"  # 10k req/s por pod

  # Trigger 2: CPU
  - type: cpu
    metricType: Utilization
    metadata:
      value: "80"

  # Trigger 3: Memory
  - type: memory
    metricType: Utilization
    metadata:
      value: "85"

  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 30
          policies:
          - type: Percent
            value: 100
            periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
          - type: Percent
            value: 50
            periodSeconds: 60
