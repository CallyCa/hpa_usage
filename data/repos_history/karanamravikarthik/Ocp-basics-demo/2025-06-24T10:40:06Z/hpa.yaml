apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: openshift-basics-demo-hpa
  namespace: krthkkaranam97-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: openshift-basics-demo-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
