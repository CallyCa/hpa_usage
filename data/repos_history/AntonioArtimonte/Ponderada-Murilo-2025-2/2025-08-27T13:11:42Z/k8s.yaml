apiVersion: v1
kind: Namespace
metadata:
  name: aula-k8s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-cm
  namespace: aula-k8s
data:
  index.html: |
    <h1>Olá, Kubernetes (k3s)!</h1>
    <p>Servido via ConfigMap.</p>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: aula-k8s
data:
  DATABASE_URL: "mysql://user:password@mysql:3306/dbname"
  API_KEY: "1234567890abcdef"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: aula-k8s
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef: { name: app-config, key: DATABASE_URL }
            - name: API_KEY
              valueFrom:
                configMapKeyRef: { name: app-config, key: API_KEY }
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
          # HPA compares usage vs requests — keep realistic requests here
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet: { path: "/", port: 80 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: "/", port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: html
          configMap: { name: web-cm }
---
# Use LoadBalancer (k3s ServiceLB gives an external IP; k3d flag mapped host:30080 -> LB:80)
apiVersion: v1
kind: Service
metadata:
  name: web-svc
  namespace: aula-k8s
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: aula-k8s
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "256Mi"
      defaultRequest:
        cpu: "100m"
        memory: "64Mi"
---
# Loosen quotas a bit so HPA can scale up to 8 replicas
apiVersion: v1
kind: ResourceQuota
metadata:
  name: hard-limits
  namespace: aula-k8s
spec:
  hard:
    pods: "20"
    requests.cpu: "4"
    requests.memory: "2Gi"
    limits.cpu: "8"
    limits.memory: "4Gi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-hpa
  namespace: aula-k8s
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
    - type: Resource
      resource:
        name: memory
        target:
          type: AverageValue
          averageValue: 200Mi
