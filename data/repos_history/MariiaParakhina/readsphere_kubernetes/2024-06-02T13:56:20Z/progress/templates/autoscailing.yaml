apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: progress-api-hpa
  namespace: progress
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: progress-api
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Pods
      pods:
        metric:
          name: progress_service_total_per_second
        target:
          type: AverageValue
          averageValue: 15000m
    

