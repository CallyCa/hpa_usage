apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotrue
  namespace: supabase
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gotrue
  template:
    metadata:
      labels:
        app: gotrue
        tier: api
        access: postgres
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.35
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Waiting for PostgreSQL to be ready..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
      containers:
        - name: gotrue
          image: supabase/gotrue:v2.132.0
          env:
            - name: GOTRUE_API_HOST
              value: "0.0.0.0"
            - name: GOTRUE_API_PORT
              value: "9999"
            - name: API_EXTERNAL_URL
              valueFrom:
                configMapKeyRef:
                  name: supabase-config
                  key: api-external-url
            - name: GOTRUE_DB_DRIVER
              value: "postgres"
            - name: GOTRUE_DB_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-urls
                  key: gotrue-url
            - name: GOTRUE_SITE_URL
              valueFrom:
                configMapKeyRef:
                  name: supabase-config
                  key: site-url
            - name: GOTRUE_URI_ALLOW_LIST
              valueFrom:
                configMapKeyRef:
                  name: supabase-config
                  key: additional-redirect-urls
            - name: GOTRUE_DISABLE_SIGNUP
              value: "false"
            - name: GOTRUE_JWT_ADMIN_ROLES
              valueFrom:
                configMapKeyRef:
                  name: supabase-config
                  key: jwt-admin-roles
            - name: GOTRUE_JWT_AUD
              valueFrom:
                configMapKeyRef:
                  name: supabase-config
                  key: jwt-aud
            - name: GOTRUE_JWT_DEFAULT_GROUP_NAME
              valueFrom:
                configMapKeyRef:
                  name: supabase-config
                  key: jwt-default-group-name
            - name: GOTRUE_JWT_EXP
              valueFrom:
                configMapKeyRef:
                  name: supabase-config
                  key: jwt-exp
            - name: GOTRUE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: supabase-secrets
                  key: jwt-secret
            - name: GOTRUE_EXTERNAL_EMAIL_ENABLED
              value: "true"
            - name: GOTRUE_MAILER_AUTOCONFIRM
              valueFrom:
                configMapKeyRef:
                  name: supabase-config
                  key: enable-auto-confirm
            - name: GOTRUE_SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: smtp-credentials
                  key: host
            - name: GOTRUE_SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: smtp-credentials
                  key: port
            - name: GOTRUE_SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: smtp-credentials
                  key: user
            - name: GOTRUE_SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: smtp-credentials
                  key: password
            - name: GOTRUE_SMTP_SENDER_NAME
              value: "Supabase"
            - name: GOTRUE_MAILER_URLPATHS_INVITE
              value: "/auth/v1/verify"
            - name: GOTRUE_MAILER_URLPATHS_CONFIRMATION
              value: "/auth/v1/verify"
            - name: GOTRUE_MAILER_URLPATHS_RECOVERY
              value: "/auth/v1/verify"
            - name: GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE
              value: "/auth/v1/verify"
            - name: GOTRUE_EXTERNAL_PHONE_ENABLED
              value: "true"
            - name: GOTRUE_SMS_AUTOCONFIRM
              value: "false"
            - name: GOTRUE_RATE_LIMIT_HEADER
              valueFrom:
                configMapKeyRef:
                  name: supabase-config
                  key: rate-limit-header
            - name: GOTRUE_RATE_LIMIT_EMAIL_SENT
              value: "3600"
            - name: GOTRUE_RATE_LIMIT_SMS_SENT
              value: "3600"
            - name: GOTRUE_RATE_LIMIT_VERIFY
              value: "360"
            - name: GOTRUE_RATE_LIMIT_TOKEN_REFRESH
              value: "150"
            - name: GOTRUE_RATE_LIMIT_SSO
              value: "30"
            - name: GOTRUE_WEBHOOK_URL
              value: ""
            - name: GOTRUE_WEBHOOK_SECRET
              value: ""
            - name: GOTRUE_WEBHOOK_EVENTS
              value: ""
            - name: GOTRUE_WEBHOOK_RETRIES
              value: "5"
            - name: GOTRUE_WEBHOOK_TIMEOUT_SEC
              value: "10"
            - name: GOTRUE_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: supabase-config
                  key: log-level
            - name: GOTRUE_OPERATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: supabase-secrets
                  key: operator-token
            - name: GOTRUE_COOKIE_KEY
              value: "sb"
            - name: GOTRUE_COOKIE_DOMAIN
              value: ""
            - name: GOTRUE_MAX_ENROLLED_FACTORS
              value: "10"
            - name: GOTRUE_SECURITY_CAPTCHA_ENABLED
              value: "false"
            - name: GOTRUE_SECURITY_CAPTCHA_PROVIDER
              value: "hcaptcha"
            - name: GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED
              value: "true"
            - name: GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL
              value: "10"
            - name: GOTRUE_SECURITY_UPDATE_PASSWORD_REQUIRE_REAUTHENTICATION
              value: "false"
          ports:
            - containerPort: 9999
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 9999
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 9999
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gotrue
  namespace: supabase
  labels:
    app: gotrue
spec:
  type: ClusterIP
  selector:
    app: gotrue
  ports:
    - port: 9999
      targetPort: 9999
      name: http
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gotrue
  namespace: supabase
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gotrue
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gotrue
  namespace: supabase
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: gotrue