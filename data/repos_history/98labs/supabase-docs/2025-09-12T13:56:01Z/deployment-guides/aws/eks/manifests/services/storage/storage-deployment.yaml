# Storage API Service Deployment for AWS EKS
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: storage-config
  namespace: supabase
data:
  ANON_KEY: "your-anon-key"
  SERVICE_KEY: "your-service-key"
  POSTGREST_URL: "http://postgrest:3000"
  PGOPTIONS: "-c search_path=storage,public"
  FILE_SIZE_LIMIT: "52428800"
  STORAGE_BACKEND: "s3"
  FILE_STORAGE_BACKEND_PATH: "./data"
  TENANT_ID: "stub"
  REGION: "us-east-1"
  GLOBAL_S3_PROTOCOL: "https"
  ENABLE_IMAGE_TRANSFORMATION: "true"
  IMGPROXY_URL: "http://imgproxy:8080"
  
---
apiVersion: v1
kind: Secret
metadata:
  name: storage-secret
  namespace: supabase
type: Opaque
stringData:
  jwt-secret: "your-super-secret-jwt-secret-with-at-least-32-characters"
  db-password: "ChangeMeToStoragePassword"
  s3-access-key: "your-s3-access-key"
  s3-secret-key: "your-s3-secret-key"
  
---
apiVersion: v1
kind: Service
metadata:
  name: storage
  namespace: supabase
  labels:
    app: storage
    tier: api
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: storage
    
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage
  namespace: supabase
  labels:
    app: storage
    tier: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: storage
  template:
    metadata:
      labels:
        app: storage
        tier: api
        database-access: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - storage
              topologyKey: topology.kubernetes.io/zone
      nodeSelector:
        nodegroup: application
      tolerations:
      - key: application
        operator: Equal
        value: "true"
        effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      serviceAccountName: storage-sa
      initContainers:
      - name: wait-for-db
        image: busybox:1.35
        command:
        - sh
        - -c
        - |
          until nc -z postgres-primary.supabase.svc.cluster.local 5432; do
            echo "Waiting for PostgreSQL to be ready..."
            sleep 2
          done
          echo "PostgreSQL is ready!"
      containers:
      - name: storage
        image: supabase/storage-api:v0.43.11
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
          protocol: TCP
        env:
        - name: ANON_KEY
          valueFrom:
            configMapKeyRef:
              name: storage-config
              key: ANON_KEY
        - name: SERVICE_KEY
          valueFrom:
            configMapKeyRef:
              name: storage-config
              key: SERVICE_KEY
        - name: POSTGREST_URL
          valueFrom:
            configMapKeyRef:
              name: storage-config
              key: POSTGREST_URL
        - name: PGRST_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: storage-secret
              key: jwt-secret
        - name: DATABASE_URL
          value: "postgres://supabase_storage:$(DB_PASSWORD)@postgres-primary.supabase.svc.cluster.local:5432/postgres?search_path=storage"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: storage-secret
              key: db-password
        - name: FILE_SIZE_LIMIT
          valueFrom:
            configMapKeyRef:
              name: storage-config
              key: FILE_SIZE_LIMIT
        - name: STORAGE_BACKEND
          valueFrom:
            configMapKeyRef:
              name: storage-config
              key: STORAGE_BACKEND
        - name: FILE_STORAGE_BACKEND_PATH
          valueFrom:
            configMapKeyRef:
              name: storage-config
              key: FILE_STORAGE_BACKEND_PATH
        - name: TENANT_ID
          valueFrom:
            configMapKeyRef:
              name: storage-config
              key: TENANT_ID
        - name: REGION
          valueFrom:
            configMapKeyRef:
              name: storage-config
              key: REGION
        - name: GLOBAL_S3_BUCKET
          value: "supabase-storage-$(AWS_ACCOUNT_ID)"
        - name: GLOBAL_S3_PROTOCOL
          valueFrom:
            configMapKeyRef:
              name: storage-config
              key: GLOBAL_S3_PROTOCOL
        - name: GLOBAL_S3_ENDPOINT
          value: "s3.$(AWS_REGION).amazonaws.com"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: storage-secret
              key: s3-access-key
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: storage-secret
              key: s3-secret-key
        - name: AWS_REGION
          value: "us-east-1"
        - name: AWS_ACCOUNT_ID
          value: "$(AWS_ACCOUNT_ID)"
        - name: ENABLE_IMAGE_TRANSFORMATION
          valueFrom:
            configMapKeyRef:
              name: storage-config
              key: ENABLE_IMAGE_TRANSFORMATION
        - name: IMGPROXY_URL
          valueFrom:
            configMapKeyRef:
              name: storage-config
              key: IMGPROXY_URL
        - name: SERVER_PORT
          value: "5000"
        - name: SERVER_HOST
          value: "0.0.0.0"
        - name: LOG_LEVEL
          value: "info"
        - name: IS_MULTITENANT
          value: "false"
        - name: MULTITENANT_DATABASE_URL
          value: ""
        - name: X_FORWARDED_HOST_REGEXP
          value: ""
        - name: STORAGE_S3_FORCE_PATH_STYLE
          value: "false"
        - name: STORAGE_S3_USE_SSL
          value: "true"
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /status
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /status
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: data
          mountPath: /var/lib/storage
      - name: imgproxy
        image: darthsim/imgproxy:v3.19
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: imgproxy
        env:
        - name: IMGPROXY_BIND
          value: ":8080"
        - name: IMGPROXY_LOCAL_FILESYSTEM_ROOT
          value: "/"
        - name: IMGPROXY_USE_ETAG
          value: "true"
        - name: IMGPROXY_USE_S3
          value: "true"
        - name: IMGPROXY_S3_ENDPOINT
          value: "s3.$(AWS_REGION).amazonaws.com"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: storage-secret
              key: s3-access-key
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: storage-secret
              key: s3-secret-key
        - name: AWS_REGION
          value: "us-east-1"
        - name: IMGPROXY_ENABLE_WEBP_DETECTION
          value: "true"
        - name: IMGPROXY_ENABLE_AVIF_DETECTION
          value: "true"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      volumes:
      - name: tmp
        emptyDir: {}
      - name: data
        emptyDir: {}
        
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: storage-sa
  namespace: supabase
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/supabase-storage-role
    
---
# IAM Policy for S3 access (to be created in AWS)
# This is a reference for the IAM policy needed
apiVersion: v1
kind: ConfigMap
metadata:
  name: storage-iam-policy
  namespace: supabase
data:
  policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": [
            "s3:ListBucket",
            "s3:GetBucketLocation",
            "s3:GetBucketVersioning",
            "s3:GetBucketAcl",
            "s3:GetBucketCORS",
            "s3:PutBucketCORS",
            "s3:GetBucketWebsite",
            "s3:GetBucketLogging",
            "s3:GetBucketNotification",
            "s3:GetBucketPolicy",
            "s3:PutBucketPolicy",
            "s3:GetBucketRequestPayment",
            "s3:GetBucketTagging",
            "s3:PutBucketTagging"
          ],
          "Resource": [
            "arn:aws:s3:::supabase-storage-*"
          ]
        },
        {
          "Effect": "Allow",
          "Action": [
            "s3:GetObject",
            "s3:GetObjectAcl",
            "s3:GetObjectVersion",
            "s3:GetObjectVersionAcl",
            "s3:PutObject",
            "s3:PutObjectAcl",
            "s3:DeleteObject",
            "s3:DeleteObjectVersion",
            "s3:RestoreObject",
            "s3:ListMultipartUploadParts",
            "s3:AbortMultipartUpload"
          ],
          "Resource": [
            "arn:aws:s3:::supabase-storage-*/*"
          ]
        }
      ]
    }
    
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: storage-hpa
  namespace: supabase
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: storage
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
        
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: storage-pdb
  namespace: supabase
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: storage