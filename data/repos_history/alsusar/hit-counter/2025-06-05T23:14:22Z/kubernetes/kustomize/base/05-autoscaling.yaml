apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hit-counter
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hit-counter
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "10"