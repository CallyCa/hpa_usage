{{- if .Values.app.backend.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "multicloud-app.fullname" . }}-backend
  labels:
    {{- include "multicloud-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "multicloud-app.fullname" . }}-backend
  minReplicas: {{ .Values.app.backend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.app.backend.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.app.backend.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.app.backend.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.app.backend.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.app.backend.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
    {{- if eq .Values.cloudProvider.name "aws" }}
    # AWS-specific custom metrics
    - type: External
      external:
        metric:
          name: sqs_messages_visible
          selector:
            matchLabels:
              queue_name: "{{ include "multicloud-app.fullname" . }}-queue"
        target:
          type: Value
          value: "30"
    {{- end }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
---
{{- end }}
{{- if .Values.app.frontend.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "multicloud-app.fullname" . }}-frontend
  labels:
    {{- include "multicloud-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "multicloud-app.fullname" . }}-frontend
  minReplicas: {{ .Values.app.frontend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.app.frontend.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.app.frontend.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.app.frontend.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
{{- end }}
