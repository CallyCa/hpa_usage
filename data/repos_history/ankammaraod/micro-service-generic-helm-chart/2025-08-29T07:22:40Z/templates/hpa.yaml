{{- $microServiceName := .Values.global.microServiceName }}
{{- if .Values.global.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $microServiceName }}-hpa
  {{- if .Values.global.labels }}
  labels:
    {{- include "microservices-helm.labels" . | nindent 4 }}
  {{- end }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $microServiceName }}
  minReplicas: {{ .Values.global.hpa.minReplicas }}
  maxReplicas: {{ .Values.global.hpa.maxReplicas }}
  metrics:
    {{- if .Values.global.hpa.metrics }}
    {{- toYaml .Values.global.hpa.metrics | nindent 4 }}
    {{- else }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    {{- end }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: {{ .Values.global.hpa.scaleUpStabilizationWindowSeconds | default 0 }}
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: {{ .Values.global.hpa.scaleDownStabilizationWindowSeconds | default 300 }}
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
{{- end }}
