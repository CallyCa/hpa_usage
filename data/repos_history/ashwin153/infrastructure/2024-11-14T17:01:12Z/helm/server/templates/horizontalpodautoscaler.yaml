{{- if gt (int .Values.replica.burst) 1 }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "server.name" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{ include "server.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "server.name" . }}
  minReplicas: {{ .Values.replica.count }}
  maxReplicas: {{ mul .Values.replica.count .Values.replica.burst }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        targetAverageUtilization: 80
    - type: Resource
      resource:
        name: memory
        targetAverageUtilization: 80
{{- end }}
