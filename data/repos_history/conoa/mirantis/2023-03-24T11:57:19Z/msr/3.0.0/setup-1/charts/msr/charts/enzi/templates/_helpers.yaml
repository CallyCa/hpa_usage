{{/*
Expand the name of the chart.
*/}}
{{- define "enzi.name" -}}
{{- coalesce .Values.nameOverride ((.Values.global | default dict) | dig "enzi" "nameOverride" "") .Chart.Name | trunc 63 | trimSuffix "-" }}
{{- end }}

{{/*
Create a default fully qualified app name.
We truncate at 63 chars because some Kubernetes name fields are limited to this (by the DNS naming spec).
If release name contains chart name it will be used as a full name.
*/}}
{{- define "enzi.fullname" -}}
{{- $fullname := coalesce .Values.fullnameOverride ((.Values.global | default dict) | dig "enzi" "fullnameOverride" "") }}
{{- if $fullname }}
{{- $fullname | trunc 63 | trimSuffix "-" }}
{{- else }}
{{- $name := coalesce .Values.nameOverride ((.Values.global | default dict) | dig "enzi" "nameOverride" "") .Chart.Name }}
{{- if contains $name .Release.Name }}
{{- .Release.Name | trunc 63 | trimSuffix "-" }}
{{- else }}
{{- printf "%s-%s" .Release.Name $name | trunc 63 | trimSuffix "-" }}
{{- end }}
{{- end }}
{{- end }}


{{/*
Create chart name and version as used by the chart label.
*/}}
{{- define "enzi.chart" -}}
{{- printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
{{- end }}

{{/*
Common labels
*/}}
{{- define "enzi.labels" -}}
helm.sh/chart: {{ include "enzi.chart" . }}
{{ include "enzi.commonSelectorLabels" . }}
{{- if .Chart.AppVersion }}
app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
{{- end }}
app.kubernetes.io/managed-by: {{ .Release.Service }}
{{- with (.Values.global | default dict).commonLabels }}
{{ toYaml . }}
{{- end }}
{{- with include "enzi.tplToYaml" (list $ .Values.commonLabels) | fromYaml }}
{{ toYaml . }}
{{- end }}
{{- end }}

{{/*
Selector labels common to multiple objects
*/}}
{{- define "enzi.commonSelectorLabels" -}}
app.kubernetes.io/name: {{ include "enzi.name" . }}
app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}

{{/*
Annotations common to multiple resources.
*/}}
{{- define "enzi.annotations" -}}
{{- with (.Values.global | default dict).commonAnnotations }}
{{ toYaml . }}
{{- end }}
{{- with .Values.commonAnnotations }}
{{ toYaml . }}
{{- end }}
{{- end -}}

{{/*
Create the name of the service account to use
*/}}
{{- define "enzi.serviceAccountName" -}}
{{- if .Values.serviceAccount.create }}
{{- default (include "enzi.fullname" .) .Values.serviceAccount.name }}
{{- else }}
{{- default "default" .Values.serviceAccount.name }}
{{- end }}
{{- end }}

{{/*
Probe to use for checking the status of the API deployment containers
*/}}
{{- define "enzi.apiHealthProbe" -}}
httpGet:
  path: /enzi/_ping
  port: 4443
  scheme: HTTPS
{{- end }}

{{/*
Build the image reference from the items contained in the "image" value.
*/}}
{{- define "enzi.imageRef" -}}

{{- $tag := coalesce .Values.image.tag .Chart.AppVersion "latest" -}}
{{- /*
     * global.imageRegistry takes highest precedence to match the behavior of
     * the bitnami charts.
     */ -}}
{{- $registry := coalesce (.Values.global | default dict).imageRegistry .Values.image.registry }}
{{- if $registry }}
  {{- printf "%s/%s:%s" $registry .Values.image.repository $tag -}}
{{- else }}
  {{- printf "%s:%s" .Values.image.repository $tag -}}
{{- end }}
{{- end }}


{{/*
Accepts a value and, if it is a string, assumes it is a template value and expands
it via the `tpl` filter before returning as YAML. Otherwise, the value is assumed
to be just YAML and passed through as such. The function takes a list of parameters
as (root, value) where `root` is the root context and `value` is the value to be
expanded or passed through, as appropriate. For example:
{{ include "enzi.tplToYaml" (list $ .Values.nodeSelector) }}
*/}}
{{- define "enzi.tplToYaml" -}}

{{/* Name the function parameters. */}}
{{- $root := index . 0 }}
{{- $value := index . 1 }}

{{- if kindIs "string" $value }}
{{- tpl $value $root | fromYaml | toYaml }}
{{- else }}
{{- toYaml $value }}
{{- end }}

{{- end }}


{{/*
Creates the value to use for "affinity" for the named component. The value will be
the result of processing the affinity setting as well as the pod anti-affinity preset
value. The function is called as follows:
{{ include "enzi.affinity" (list $ "api") }}
*/}}
{{- define "enzi.affinity" -}}

{{/* Name the function parameters. */}}
{{- $root := index . 0 }}
{{- $component := index . 1 }}

{{- $affinity := include "enzi.tplToYaml" (list $root $root.Values.affinity) | fromYaml }}

{{- $preset := include "enzi.podAntiAffinityPreset" (dict "type" (tpl $root.Values.podAntiAffinityPreset $root) "component" (kebabcase $component) "context" $root) | fromYaml }}

{{- $preset | mustMerge $affinity | toYaml }}
{{- end }}


{{/*
Return a soft podAntiAffinity preset.
{{ include "enzi.podAntiAffinityPreset.soft" (dict "component" "FOO" "context" $) -}}
*/}}
{{- define "enzi.podAntiAffinityPreset.soft" -}}
podAntiAffinity:
  preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 1
      podAffinityTerm:
        labelSelector:
          matchLabels: {{- (include "enzi.commonSelectorLabels" .context) | nindent 12 }}
            {{- with .component }}
            app.kubernetes.io/component: {{ . }}
            {{- end }}
        namespaces:
          - {{ .context.Release.Namespace | quote }}
        topologyKey: kubernetes.io/hostname
{{- end -}}

{{/*
Return a hard podAntiAffinity preset.
{{ include "enzi.podAntiAffinityPreset.hard" (dict "component" "FOO" "context" $) -}}
*/}}
{{- define "enzi.podAntiAffinityPreset.hard" -}}
{{- $component := default "" .component -}}
podAntiAffinity:
  requiredDuringSchedulingIgnoredDuringExecution:
    - labelSelector:
        matchLabels: {{- (include "enzi.commonSelectorLabels" .context) | nindent 10 }}
          {{- with .component }}
          app.kubernetes.io/component: {{ . }}
          {{- end }}
      namespaces:
        - {{ .context.Release.Namespace | quote }}
      topologyKey: kubernetes.io/hostname
{{- end -}}

{{/*
Return the given podAntiAffinity preset from given type. Provide an optional
component to specify when setting affinity with (dict "component" "foobar").
{{ include "enzi.podAntiAffinityPreset" (dict "type" "soft" "context" $ -}}
*/}}
{{- define "enzi.podAntiAffinityPreset" -}}
  {{- if eq .type "soft" }}
    {{- include "enzi.podAntiAffinityPreset.soft" . -}}
  {{- else if eq .type "hard" }}
    {{- include "enzi.podAntiAffinityPreset.hard" . -}}
  {{- end -}}
{{- end -}}

{{/*
Return the given HorizontalPodAutoscaler yaml for the specified component.
{{ include "enzi.hpaPreset" (dict "component" "api" "context" $ -}}
*/}}
{{- define "enzi.hpaPreset" -}}
{{- $fullname := include "enzi.fullname" .context -}}
{{- $component := required "A component must be provided when including the hpaPreset" .component -}}
{{- $scaling := (index .context.Values $component).autoscaling -}}
{{- if $scaling.enabled -}}
apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: {{ printf "%s-%s" $fullname $component }}
  labels:
    {{- include "enzi.labels" .context | nindent 4 }}
    {{- with $component }}
    app.kubernetes.io/component: {{ . }}
    {{- end }}
  annotations:
    {{- include "enzi.annotations" .context | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ printf "%s-%s" $fullname $component }}
  {{- with $scaling.minReplicas }}
  minReplicas: {{ . }}
  {{- end }}
  {{- with $scaling.maxReplicas }}
  maxReplicas: {{ . }}
  {{- end }}
  {{- with $scaling.targetCPUUtilizationPercentage }}
  targetCPUUtilizationPercentage: {{ . }}
  {{- end }}
{{- end -}}
{{- end -}}


{{/*
The name of the stored secret containing the enzi TLS credentials.
*/}}
{{- define "enzi.TLSSecretName" -}}
    {{ coalesce .Values.tlsCertSecret (print (include "enzi.fullname" .) "-rethinkdb-driver-client-cert") }}
{{- end -}}

{{/*
The name of the stored secret containing the enzi TLS CA bundle.
*/}}
{{- define "enzi.TLSCABundleSecretName" -}}
    {{ coalesce .Values.tlsCABundleSecret (print (include "enzi.fullname" .) "-rethinkdb-driver-ca-cert") }}
{{- end -}}


{{/*
The database address of the enzi service where the enzi database resides.
This value is unique as it connects to {{ rethinkdb.fullname }}-proxy by
default.
FIXME (ENGDTR-2850): The "rethinkdb" .Chart.Name is hardcoded as a workaround,
the long term fix for this will be to merge the enzi subchart into the msr
parent.
*/}}
{{- define "enzi.rethinkDBAddr" -}}
{{- if .Values.dbAddr }}
{{- .Values.dbAddr }}
{{- else }}
{{- $fullname := (.Values.global | default dict) | dig "rethinkdb" "fullnameOverride" "" }}
{{- if $fullname }}
{{- print ($fullname | trunc 63 | trimSuffix "-") "-proxy" }}
{{- else }}
{{- $name := coalesce ((.Values.global | default dict) | dig "rethinkdb" "nameOverride" "") "rethinkdb" }}
{{- if contains $name .Release.Name }}
{{- print (.Release.Name | trunc 63 | trimSuffix "-") "-proxy" }}
{{- else }}
{{- printf "%s-%s-proxy" .Release.Name ($name | trunc 63 | trimSuffix "-") }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}

{{/*
Render a list of image pull secrets.  Concat's given
"global.imagePullSecrets" with "image.pullSecrets".

Usage:
    {{- with include "enzi.imagePullSecrets" . }}
    imagePullSecrets: {{ . | indent 8 }}
    {{- end }}
*/}}
{{- define "enzi.imagePullSecrets" -}}
{{- $secrets := (.Values.global | default dict).imagePullSecrets | default list -}}
{{- $secrets = concat $secrets (.Values.image.pullSecrets | default list) -}}
{{- range $secrets | sortAlpha | uniq -}}
{{"\n"}}- name: {{ . | quote }}
{{- end -}}
{{- end -}}

{{/*
The name of the enzi worker headless service.
*/}}
{{- define "enzi.worker.svc" -}}
{{- include "enzi.fullname" . -}}-worker
{{- end -}}
