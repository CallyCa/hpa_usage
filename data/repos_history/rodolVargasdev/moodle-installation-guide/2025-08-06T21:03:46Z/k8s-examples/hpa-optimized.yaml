# HPA optimizado para 1000 usuarios simultáneos
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: moodle-hpa-optimized
  namespace: moodle-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: moodle
  minReplicas: 5  # Base sólida para arrancar
  maxReplicas: 25 # Suficiente para 1000 usuarios
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60  # Más conservador para mejor rendimiento
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 minutos antes de reducir
      policies:
      - type: Percent
        value: 10  # Reducir máximo 10% cada vez
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60   # Escalar rápido cuando sea necesario
      policies:
      - type: Percent
        value: 50  # Escalar hasta 50% más rápido
        periodSeconds: 30
