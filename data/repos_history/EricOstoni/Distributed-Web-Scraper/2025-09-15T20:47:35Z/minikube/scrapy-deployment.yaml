apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrapy-workers
  namespace: webscraper
spec:
  replicas: 3
  selector:
    matchLabels:
      app: scrapy-workers
  template:
    metadata:
      labels:
        app: scrapy-workers
    spec:
      containers:
        - name: scrapy-worker
          image: webscraper-scrapy:latest
          imagePullPolicy: Never
          env:
            - name: AWS_ACCESS_KEY_ID
              value: "local"
            - name: AWS_SECRET_ACCESS_KEY
              value: "local"
            - name: AWS_REGION
              value: "eu-central-1"
            - name: DYNAMODB_ENDPOINT
              value: "http://dynamodb:8000"
            - name: TABLE_NAME
              value: "Products"
            - name: REDIS_URL
              value: "redis://redis-service:6379/0"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scrapy-hpa
  namespace: webscraper
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scrapy-workers
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

---

